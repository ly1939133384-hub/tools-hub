<script>
/* 六西格玛黑带 120 题 · 离线答题版
   数据来自 window.QDATA（由 parse2.py 从讲义 md 生成） */
(function () {
  "use strict";

  var D = window.QDATA || { questions: [], tips: [], meta: {} };
  var QS = D.questions || [];
  var BY = {};
  QS.forEach(function (q) { BY[q.id] = q; });
  var CHS = (D.meta && D.meta.chapters) || [];
  var CHN = {};
  CHS.forEach(function (c) { CHN[c.id] = c.name; });
  var TOTAL = QS.length;
  var KEY = "sgb120.v1";

  /* ---------------- 状态 ---------------- */
  var VIEWS = ["practice", "drill", "wrong", "cards", "stats", "sheet"];
  var S = load();
  var view = (S.ui && S.ui.mode) || "practice";
  if (VIEWS.indexOf(view) < 0) view = "practice";
  var filt = { ch: "all", type: "all", scope: "all" };
  var deck = { ids: QS.map(function (q) { return q.id; }), pos: 0, round: {}, label: "全部 120 题", custom: false };
  var pick = { sel: [], done: false, revealed: false };
  var cardDeck = QS.map(function (q) { return q.id; });
  var cardIdx = 0, cardOpen = false, cardCh = "all";
  var searchTerm = "";

  function blank() { return { ans: {}, wrong: {}, fav: {}, hist: [], ui: {} }; }
  /* 逐条清洗：localStorage 是全机同源共享的，旧版成品可能留下不同 schema 的记录
     （例如 ans[1] = "C" 字符串），不清洗会在渲染时抛 TypeError → 整页白屏 */
  function load() {
    var out = blank(), o, raw;
    try {
      raw = localStorage.getItem(KEY);
      if (!raw) return out;
      o = JSON.parse(raw);
    } catch (e) { return out; }
    if (!o || typeof o !== "object") return out;

    var a = (o.ans && typeof o.ans === "object") ? o.ans : {};
    Object.keys(a).forEach(function (k) {
      var id = parseInt(k, 10);
      if (!(id > 0) || !BY[id]) return;
      var v = a[k], sel = null, ok = null, ts = 0;
      if (Array.isArray(v)) sel = v.slice();
      else if (typeof v === "string") sel = v.split("");
      else if (v && typeof v === "object") {
        if (Array.isArray(v.sel)) sel = v.sel.slice();
        else if (typeof v.sel === "string") sel = v.sel.split("");
        if (typeof v.ok === "boolean") ok = v.ok;
        if (typeof v.ts === "number") ts = v.ts;
      }
      if (!sel) return;
      sel = sel.filter(function (x) { return typeof x === "string" && /^[A-E]$/.test(x); });
      if (!sel.length) return;
      sel.sort();
      if (ok === null) ok = sel.join("") === BY[id].answer.slice().sort().join("");
      out.ans[id] = { sel: sel, ok: ok, ts: ts };
    });

    var w = (o.wrong && typeof o.wrong === "object") ? o.wrong : {};
    Object.keys(w).forEach(function (k) {
      var id = parseInt(k, 10);
      if (!(id > 0) || !BY[id]) return;
      var v = w[k], n = 1, ts = 0, fixed = false;
      if (typeof v === "number") n = v;
      else if (v && typeof v === "object") {
        if (typeof v.n === "number" && v.n > 0) n = v.n;
        if (typeof v.ts === "number") ts = v.ts;
        fixed = v.fixed === true;
      }
      out.wrong[id] = { n: n, ts: ts, fixed: fixed };
    });

    var f = (o.fav && typeof o.fav === "object") ? o.fav : {};
    Object.keys(f).forEach(function (k) {
      var id = parseInt(k, 10);
      if (id > 0 && BY[id]) out.fav[id] = 1;
    });

    if (Array.isArray(o.hist)) {
      out.hist = o.hist.filter(function (h) {
        return h && typeof h === "object" && BY[h.id];
      }).map(function (h) {
        return { id: h.id, ok: h.ok === true, ts: typeof h.ts === "number" ? h.ts : 0 };
      }).slice(-600);
    }

    if (o.ui && typeof o.ui === "object") {
      var ui = {};
      if (VIEWS.indexOf(o.ui.mode) >= 0) ui.mode = o.ui.mode;
      if (typeof o.ui.pos === "number" && o.ui.pos >= 0) ui.pos = o.ui.pos;
      if (o.ui.filt && typeof o.ui.filt === "object") {
        var fl = { ch: "all", type: "all", scope: "all" };
        if (o.ui.filt.ch === "all" || CHN[o.ui.filt.ch]) fl.ch = o.ui.filt.ch;
        if (["all", "single", "multi"].indexOf(o.ui.filt.type) >= 0) fl.type = o.ui.filt.type;
        if (["all", "todo", "wrong", "fav"].indexOf(o.ui.filt.scope) >= 0) fl.scope = o.ui.filt.scope;
        ui.filt = fl;
      }
      out.ui = ui;
    }
    return out;
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        ans: S.ans, wrong: S.wrong, fav: S.fav, hist: S.hist,
        ui: { mode: view, filt: filt, pos: deck.custom ? 0 : deck.pos }
      }));
    } catch (e) {}
  }

  /* ---------------- 工具 ---------------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function md(t) {
    if (!t) return "";
    var s = esc(t);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*\*/g, "").replace(/`([^`]+)`/g, "<code>$1</code>");
    var lines = s.split("\n"), out = "", inUl = false;
    function isRow(ln) {
      var x = ln.trim();
      return x.length > 2 && x.charAt(0) === "|" && x.charAt(x.length - 1) === "|";
    }
    function isSep(ln) { return /^\|[\s:|-]+\|$/.test(ln.trim()) && ln.indexOf("-") >= 0; }
    function cells(row) {
      return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
    }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      /* 表格：表头行 + |---|---| 分隔行 + 若干数据行 */
      if (isRow(ln) && i + 1 < lines.length && isSep(lines[i + 1])) {
        if (inUl) { out += "</ul>"; inUl = false; }
        var head = cells(ln), body = [], j = i + 2;
        while (j < lines.length && isRow(lines[j])) { body.push(cells(lines[j])); j++; }
        out += '<table class="md-tb"><thead><tr>' +
          head.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead><tbody>" +
          body.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") +
          "</tbody></table>";
        i = j - 1;
        continue;
      }
      var m = ln.match(/^\s*[-*]\s+(.*)$/);
      if (m) {
        if (!inUl) { out += "<ul>"; inUl = true; }
        out += "<li>" + m[1] + "</li>";
      } else {
        if (inUl) { out += "</ul>"; inUl = false; }
        if (ln.trim()) out += "<p>" + ln + "</p>";
      }
    }
    if (inUl) out += "</ul>";
    return out;
  }
  function same(a, b) {
    if (a.length !== b.length) return false;
    var x = a.slice().sort().join(""), y = b.slice().sort().join("");
    return x === y;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function barClass(p) { return p >= 80 ? "" : p >= 60 ? "low" : "bad"; }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 1600);
  }

  /* ---------------- 统计 ---------------- */
  function overall() {
    var ids = Object.keys(S.ans), ok = 0;
    ids.forEach(function (k) { if (S.ans[k].ok) ok++; });
    var un = 0;
    Object.keys(S.wrong).forEach(function (k) { if (!S.wrong[k].fixed) un++; });
    return { answered: ids.length, ok: ok, acc: pct(ok, ids.length), wrongOpen: un, fav: Object.keys(S.fav).length };
  }
  function chStat(cid) {
    var list = QS.filter(function (q) { return q.ch === cid; });
    var ansN = 0, okN = 0;
    list.forEach(function (q) {
      var a = S.ans[q.id];
      if (a) { ansN++; if (a.ok) okN++; }
    });
    return { total: list.length, answered: ansN, ok: okN, acc: pct(okN, ansN) };
  }
  function tagStat(tag) {
    var list = QS.filter(function (q) { return q.tag === tag; });
    var ansN = 0, okN = 0;
    list.forEach(function (q) {
      var a = S.ans[q.id];
      if (a) { ansN++; if (a.ok) okN++; }
    });
    return { total: list.length, answered: ansN, ok: okN, acc: pct(okN, ansN) };
  }

  /* ---------------- 出题 ---------------- */
  function buildDeck(opt) {
    opt = opt || {};
    var ids = QS.filter(function (q) {
      if (filt.ch !== "all" && q.ch !== filt.ch) return false;
      if (filt.type === "single" && q.type === "多选") return false;
      if (filt.type === "multi" && q.type !== "多选") return false;
      if (filt.scope === "todo" && S.ans[q.id]) return false;
      if (filt.scope === "wrong" && !(S.wrong[q.id] && !S.wrong[q.id].fixed)) return false;
      if (filt.scope === "fav" && !S.fav[q.id]) return false;
      return true;
    }).map(function (q) { return q.id; });

    if (opt.shuffle) ids = shuffle(ids);
    if (opt.limit && ids.length > opt.limit) ids = ids.slice(0, opt.limit);
    deck = { ids: ids, pos: 0, round: {}, label: labelOf(opt), custom: false };
    pick = { sel: [], done: false, revealed: false };
  }
  function labelOf(opt) {
    var parts = [];
    parts.push(filt.ch === "all" ? "全部模块" : CHN[filt.ch]);
    if (filt.type !== "all") parts.push(filt.type === "single" ? "单选" : "多选");
    if (filt.scope === "todo") parts.push("未做");
    if (filt.scope === "wrong") parts.push("错题");
    if (filt.scope === "fav") parts.push("收藏");
    if (opt && opt.shuffle) parts.push("乱序");
    return parts.join(" · ");
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function curQ() { return deck.ids.length ? BY[deck.ids[deck.pos]] : null; }

  /* ---------------- 答题 ---------------- */
  function record(id, ok, sel) {
    S.ans[id] = { sel: sel.slice(), ok: ok, ts: Date.now() };
    if (ok) {
      if (S.wrong[id]) { S.wrong[id].fixed = true; }
    } else {
      S.wrong[id] = { n: (S.wrong[id] ? S.wrong[id].n : 0) + 1, ts: Date.now(), fixed: false };
    }
    S.hist.push({ id: id, ok: ok, ts: Date.now() });
    if (S.hist.length > 600) S.hist = S.hist.slice(-600);
    save();
  }
  function selectOpt(k) {
    if (pick.done) return;
    var q = curQ(); if (!q) return;
    if (q.type === "多选") {
      var i = pick.sel.indexOf(k);
      if (i >= 0) pick.sel.splice(i, 1); else pick.sel.push(k);
      pick.sel.sort();
      render();
    } else {
      pick.sel = [k];
      submit();
    }
  }
  function submit() {
    var q = curQ();
    if (!q || pick.done || !pick.sel.length) return;
    var ok = same(pick.sel, q.answer);
    pick.done = true;
    deck.round[q.id] = ok;
    record(q.id, ok, pick.sel);
    render();
    var fb = document.getElementById("fb");
    if (fb && fb.scrollIntoView) {
      var r = fb.getBoundingClientRect();
      if (r.top > window.innerHeight - 120 || r.top < 70) fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }
  function reveal() {
    var q = curQ();
    if (!q || pick.done) return;
    pick.done = true; pick.revealed = true;
    deck.round[q.id] = false;
    deck.rev = deck.rev || {}; deck.rev[q.id] = 1;
    record(q.id, false, []);
    render();
  }
  /* 回看已答过的题时，恢复锁定态与解析（否则要重答一遍才能看解析，还会覆盖记录） */
  function syncPick() {
    var q = curQ();
    pick = { sel: [], done: false, revealed: false };
    if (!q || !Object.prototype.hasOwnProperty.call(deck.round, q.id)) return;
    var st = S.ans[q.id];
    pick.sel = st && st.sel ? st.sel.slice() : [];
    pick.done = true;
    pick.revealed = !!(deck.rev && deck.rev[q.id]);
  }
  function goPos(d) {
    if (!deck.ids.length) return;
    var n = deck.pos + d;
    if (n < 0) n = 0;
    if (n >= deck.ids.length) { deck.pos = deck.ids.length; pick = { sel: [], done: false, revealed: false }; render(); return; }
    deck.pos = n;
    syncPick();
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function jumpTo(id) {
    var i = deck.ids.indexOf(id);
    if (i < 0) {
      var chId = BY[id].ch;
      var sib = QS.filter(function (x) { return x.ch === chId; }).map(function (x) { return x.id; });
      i = sib.indexOf(id);
      deck = { ids: sib, pos: i < 0 ? 0 : i, round: {}, label: (CHN[chId] || "") + " · 定位练习", custom: true };
    } else {
      deck.pos = i;
    }
    pick = { sel: [], done: false, revealed: false };
    view = "practice"; save(); render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------------- 渲染：练习 ---------------- */
  function hudHTML() {
    var g = overall();
    return '<div class="hud">' +
      '<span>已答 <b>' + g.answered + '</b>/' + TOTAL + '</span><span class="sep"></span>' +
      '<span>正确率 <b>' + (g.answered ? g.acc + '%' : "—") + '</b></span><span class="sep"></span>' +
      '<span>错题 <b>' + g.wrongOpen + '</b></span></div>';
  }

  function filtersHTML() {
    if (deck.custom) {
      return '<div class="filters"><span class="tg ty">专项题组</span>' +
        '<span style="font-size:13px;color:var(--ink2)">' + esc(deck.label) + ' · ' + deck.ids.length + ' 题</span>' +
        '<span style="flex:1"></span>' +
        '<button class="btn sm" data-act="shuffle">打乱本组</button>' +
        '<button class="btn sm" data-act="all">退出，回到筛选练习</button></div>';
    }
    var chOpts = '<option value="all">全部模块</option>' + CHS.map(function (c) {
      var st = chStat(c.id);
      return '<option value="' + c.id + '"' + (filt.ch === c.id ? " selected" : "") + '>' + esc(c.id + " " + c.name) + "（" + st.total + "题）</option>";
    }).join("");
    return '<div class="filters">' +
      '<span class="sel"><select data-act="fch">' + chOpts + '</select></span>' +
      '<button class="chip' + (filt.type === "all" ? " on" : "") + '" data-act="ftype" data-v="all">全部题型</button>' +
      '<button class="chip' + (filt.type === "single" ? " on" : "") + '" data-act="ftype" data-v="single">单选</button>' +
      '<button class="chip' + (filt.type === "multi" ? " on" : "") + '" data-act="ftype" data-v="multi">多选</button>' +
      '<span class="fsep"></span>' +
      '<button class="chip scope' + (filt.scope === "all" ? " on" : "") + '" data-act="fscope" data-v="all">全部</button>' +
      '<button class="chip scope' + (filt.scope === "todo" ? " on" : "") + '" data-act="fscope" data-v="todo">未做</button>' +
      '<button class="chip scope' + (filt.scope === "wrong" ? " on" : "") + '" data-act="fscope" data-v="wrong">错题</button>' +
      '<button class="chip scope' + (filt.scope === "fav" ? " on" : "") + '" data-act="fscope" data-v="fav">收藏</button>' +
      '<span style="flex:1"></span>' +
      '<button class="btn sm" data-act="shuffle">打乱本组</button>' +
      '</div>';
  }

  function viewPractice() {
    if (!deck.ids.length) {
      return filtersHTML() + '<div class="panel empty"><div class="big">这个条件下没有题目</div>' +
        '<div>换个筛选条件试试，或点下面的按钮回到全部题目</div>' +
        '<div style="margin-top:16px"><button class="btn primary" data-act="all">回到全部 120 题</button></div></div>';
    }
    if (deck.pos >= deck.ids.length) return filtersHTML() + roundSummary();

    var q = curQ();
    var a = S.ans[q.id];
    var w = S.wrong[q.id];
    var isMulti = q.type === "多选";

    var head = '<div class="qhead">' +
      '<span class="qno">题 ' + q.id + '</span>' +
      '<span class="tg ty">' + esc(q.type) + '</span>' +
      '<span class="tg">' + esc(q.tag) + '</span>' +
      '<span class="tg">' + esc(q.ch + " " + (CHN[q.ch] || "")) + '</span>' +
      (w && !w.fixed ? '<span class="badge r">错 ' + w.n + ' 次</span>' : "") +
      (a ? '<span class="badge ' + (a.ok ? "g" : "n") + '">上次' + (a.ok ? "答对" : "答错") + '</span>' : "") +
      '<button class="star' + (S.fav[q.id] ? " on" : "") + '" data-act="star" data-id="' + q.id + '" title="收藏（F）">' + (S.fav[q.id] ? "★" : "☆") + '</button>' +
      '</div>';

    var opts = q.options.map(function (o) {
      var cls = "opt";
      if (pick.done) {
        cls += " locked";
        var isAns = q.answer.indexOf(o.k) >= 0;
        var isSel = pick.sel.indexOf(o.k) >= 0;
        if (isAns && isSel) cls += " correct";
        else if (isAns) cls += " missed";
        else if (isSel) cls += " wrong";
      } else if (pick.sel.indexOf(o.k) >= 0) cls += " sel";
      var mk = "";
      if (pick.done) {
        if (q.answer.indexOf(o.k) >= 0 && pick.sel.indexOf(o.k) >= 0) mk = '<span class="mk" style="color:var(--ok)">✓ 正确</span>';
        else if (q.answer.indexOf(o.k) >= 0) mk = '<span class="mk" style="color:var(--ok)">正确答案</span>';
        else if (pick.sel.indexOf(o.k) >= 0) mk = '<span class="mk" style="color:var(--bad)">✗ 误选</span>';
      }
      return '<button class="' + cls + '" data-act="opt" data-k="' + o.k + '"' + (pick.done ? " disabled" : "") + '>' +
        '<span class="k">' + o.k + '</span><span class="t">' + md(o.t) + '</span>' + mk + '</button>';
    }).join("");

    var acts = "";
    if (!pick.done) {
      if (isMulti) {
        var mprev = S.ans[q.id];
        var mhint = mprev
          ? "上次选 " + (mprev.sel.length ? mprev.sel.join("") : "未作答") + "（" + (mprev.ok ? "答对" : "答错") + "）· 选出全部正确项后提交"
          : "多选：选出全部正确项后提交";
        acts = '<button class="btn primary" data-act="submit"' + (pick.sel.length ? "" : " disabled") + '>提交答案</button>' +
          '<button class="btn ghost" data-act="reveal">不会，看答案</button>' +
          '<span class="hint">' + esc(mhint) + '</span>';
      } else {
        var prev = S.ans[q.id];
        var hintTxt = prev
          ? "上次选 " + (prev.sel.length ? prev.sel.join("") : "未作答") + "（" + (prev.ok ? "答对" : "答错") + "）· 点选项可重做"
          : "点选项即判题";
        acts = '<button class="btn ghost" data-act="reveal">不会，看答案</button>' +
          '<span class="hint">' + esc(hintTxt) + '</span>';
      }
    } else {
      acts = '<button class="btn primary" data-act="next">下一题 →</button>' +
        '<button class="btn ghost" data-act="prev">← 上一题</button>' +
        '<button class="btn ghost" data-act="redo">重做本题</button>' +
        (a && !pick.revealed ? '<span class="hint">本次已记入统计</span>' : '<span class="hint">已按“不会”记入错题本</span>');
    }

    var fb = pick.done ? feedbackHTML(q) : "";
    var rowTotal = deck.ids.length;
    var rowDone = Object.keys(deck.round).length;

    var main = '<div class="panel pad">' + head +
      '<div class="stem">' + md(q.stem) + '</div>' +
      '<div class="opts">' + opts + '</div>' +
      '<div class="acts">' + acts + '</div>' + fb + '</div>' +
      '<div class="qnav">' +
      '<button class="btn sm" data-act="prev">← 上一题</button>' +
      '<button class="btn sm" data-act="next">下一题 →</button>' +
      '<span class="pos">' + (deck.pos + 1) + " / " + rowTotal + " · " + esc(deck.label) + " · 本轮已答 " + rowDone + '</span>' +
      '</div>';

    var pctDone = rowTotal ? Math.round((rowDone / rowTotal) * 100) : 0;
    var dbar = '<div class="deckbar" title="本组进度"><i style="width:' + pctDone + '%"></i></div>';
    return filtersHTML() + dbar + '<div class="split"><div>' + main + '</div>' + asideHTML(q) + '</div>';
  }

  function feedbackHTML(q) {
    var ok = same(pick.sel, q.answer);
    var stat = S.ans[q.id];
    var attempted = stat ? stat.sel : [];
    var ansStr = q.answer.join("");
    var mineStr = attempted.length ? attempted.join("") : "未作答";
    var head = '<div class="fb-h">' +
      '<span class="res">' + (ok ? "✓ 回答正确" : (pick.revealed ? "已看答案（记入错题本）" : "✗ 回答错误")) + '</span>' +
      '<span style="font-weight:500;font-size:12.5px;opacity:.85">' + (ok || pick.revealed ? "" : "你选 " + esc(mineStr) + " · ") + "正确答案" + '</span>' +
      '<span class="ans">' + ansStr + '</span></div>';

    var body = "";
    if (!ok && q.type === "多选" && attempted.length) {
      var miss = q.answer.filter(function (k) { return attempted.indexOf(k) < 0; });
      var extra = attempted.filter(function (k) { return q.answer.indexOf(k) < 0; });
      var bits = [];
      if (miss.length) bits.push("少选 <b>" + miss.join("、") + "</b>");
      if (extra.length) bits.push("多选 <b>" + extra.join("、") + "</b>");
      if (bits.length) body += '<div class="fb-note">' + bits.join("，") + "　多选题必须与正确答案完全一致（不多不少）才算对。</div>";
    }
    if (q.analysis) body += blk("解析", '<div class="md">' + md(q.analysis) + "</div>");
    if (q.note) body += blk("补充注释", '<div class="note md">' + md(q.note) + "</div>");
    if (q.traps && q.traps.length) {
      body += blk("易错陷阱", '<ul class="traps">' + q.traps.map(function (t) { return "<li>" + md(t) + "</li>"; }).join("") + "</ul>");
    }
    if (q.memory) body += blk("记忆要点", '<div class="memo">' + md(q.memory) + "</div>");

    var rel = QS.filter(function (x) { return x.tag === q.tag && x.id !== q.id; }).slice(0, 6);
    if (rel.length) {
      body += blk("同考点", '<div class="rel">' + rel.map(function (x) {
        return '<button data-act="jump" data-id="' + x.id + '">题' + x.id + '</button>';
      }).join("") + "</div>");
    }

    return '<div class="fb ' + (ok ? "ok" : "bad") + '" id="fb" role="status">' + head + '<div class="fb-body">' + body + "</div></div>";
  }
  function blk(t, inner) { return '<div class="blk"><div class="blk-t">' + t + "</div>" + inner + "</div>"; }

  function asideHTML(q) {
    var cells = deck.ids.map(function (id, i) {
      var cls = "gn";
      var r = deck.round[id];
      if (r === true) cls += " ok";
      else if (r === false) cls += " bad";
      else if (S.ans[id]) cls += S.ans[id].ok ? " ok" : " bad";
      else cls += " todo";
      if (i === deck.pos) cls += " cur";
      return '<button class="' + cls + '" data-act="gopos" data-i="' + i + '" title="题' + id + '">' + id + "</button>";
    }).join("");
    var g = overall();
    return '<aside class="aside">' +
      '<div class="panel pad"><h3 class="side-t">本组题号（' + deck.ids.length + '）</h3><div class="gridno">' + cells + "</div>" +
      '<div class="legend"><span><i style="background:var(--ok-soft);border:1px solid #bcdccb"></i>答对</span>' +
      '<span><i style="background:var(--bad-soft);border:1px solid #eec9c3"></i>答错</span>' +
      '<span><i style="background:#fbfbf7;border:1px solid var(--line2)"></i>未做</span></div></div>' +
      '<div class="panel pad"><h3 class="side-t">总进度</h3><div class="mini">' +
      '<div><b>' + g.answered + "</b><span>已答 / " + TOTAL + "</span></div>" +
      '<div><b>' + (g.answered ? g.acc + "%" : "—") + "</b><span>正确率</span></div>" +
      '<div><b>' + g.wrongOpen + "</b><span>待订正</span></div>" +
      '<div><b>' + g.fav + "</b><span>收藏</span></div></div></div>" +
      '<div class="panel pad"><h3 class="side-t">快捷键</h3>' +
      '<div class="hint" style="line-height:2"><span class="kbd">A</span>–<span class="kbd">D</span> 选答案 · <span class="kbd">Enter</span> 提交/下一题<br>' +
      '<span class="kbd">←</span> <span class="kbd">→</span> 切题 · <span class="kbd">S</span> 看答案 · <span class="kbd">F</span> 收藏</div></div>' +
      "</aside>";
  }

  function roundSummary() {
    var ids = Object.keys(deck.round);
    var ok = ids.filter(function (k) { return deck.round[k]; }).length;
    var bad = ids.length - ok;
    var wrongList = ids.filter(function (k) { return !deck.round[k]; });
    var left = deck.ids.length - ids.length;
    if (left < 0) left = 0;

    var statusHTML = "";
    if (left > 0) statusHTML = '<div style="margin-top:12px;color:var(--amber);font-weight:600">还有 ' + left + " 题没做，本组未完成</div>";
    else if (!ids.length) statusHTML = '<div style="margin-top:12px;color:var(--ink2);font-weight:600">这一组还没开始作答</div>';
    else if (!bad) statusHTML = '<div style="margin-top:12px;color:var(--ok);font-weight:600">全对，这一组可以过了</div>';

    var chips = wrongList.length ? '<div style="margin-top:14px" class="rel">' + wrongList.slice(0, 30).map(function (id) {
      return '<button data-act="jump" data-id="' + id + '">题' + id + '</button>';
    }).join("") + "</div>" : "";

    /* 未做完时大字显示「已答/总数」而不是百分比，避免把部分正确率误读成本组成绩 */
    var bigTxt = left > 0 ? (ids.length + " / " + deck.ids.length) : (ids.length ? pct(ok, ids.length) + "%" : "—");
    var subTxt = left > 0 ? ("已答 " + ids.length + " 题 · 对 " + ok + " · 错 " + bad)
      : ("答 " + ids.length + " 题 · 对 " + ok + " · 错 " + bad);

    return '<div class="panel pad" style="text-align:center;padding:36px 24px">' +
      '<div style="font-size:13px;letter-spacing:.12em;color:var(--ink3);font-weight:800">本轮结束 · ' + esc(deck.label) + '</div>' +
      '<div style="font-size:44px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px">' + bigTxt + '</div>' +
      '<div style="color:var(--ink2);font-size:13.5px">' + subTxt + '</div>' +
      chips + statusHTML +
      '<div class="acts" style="justify-content:center;margin-top:22px">' +
      '<button class="btn primary" data-act="restart">再来一轮</button>' +
      (wrongList.length ? '<button class="btn" data-act="wrongredo" data-round="1">练本轮错题（' + wrongList.length + '）</button>' : "") +
      '<button class="btn ghost" data-act="mode" data-v="stats">看统计</button></div></div>';
  }

  /* ---------------- 渲染：考点 ---------------- */
  function viewDrill() {
    var cards = CHS.map(function (c) {
      var st = chStat(c.id);
      return '<button class="chcard" data-act="drill" data-ch="' + c.id + '">' +
        '<div class="nm">' + esc(c.name) + '</div>' +
        '<div class="meta">' + c.id + " · " + st.total + " 题 · 已答 " + st.answered + (st.answered ? " · 正确率 " + st.acc + "%" : "") + '</div>' +
        '<div class="bar"><i class="' + barClass(st.acc) + '" style="width:' + (st.answered ? st.acc : 0) + '%"></i></div>' +
        "</button>";
    }).join("");

    var allTags = {};
    QS.forEach(function (q) { allTags[q.tag] = 1; });
    var tagHTML = CHS.map(function (c) {
      var seen = {}, list = [];
      QS.forEach(function (q) {
        if (q.ch === c.id && !seen[q.tag]) { seen[q.tag] = 1; list.push(q.tag); }
      });
      if (!list.length) return "";
      return '<div class="taggroup"><h4>' + esc(c.id + " " + c.name) + '</h4><div class="tagcloud">' +
        list.map(function (t) {
          var st = tagStat(t);
          var cls = st.answered ? (st.acc >= 80 ? "g" : "r") : "";
          return '<button class="tagbtn" data-act="starttag" data-v="' + esc(t) + '">' + esc(t) +
            '<span class="acc ' + cls + '">' + st.total + "题" + (st.answered ? " · " + st.acc + "%" : "") + "</span></button>";
        }).join("") + "</div></div>";
    }).join("");

    return '<h1 class="h1">按模块 / 考点出题</h1>' +
      '<p class="sub">点模块进入该模块的整组练习；点下方考点标签，只练这一考点（标签右侧为该考点题数/正确率）。</p>' +
      '<div class="cards">' + cards + "</div>" +
      '<div class="panel pad" style="margin-top:18px"><h3 class="side-t">全部考点（' + Object.keys(allTags).length + ' 个，按模块分组）</h3>' + tagHTML + "</div>" +
      '<div class="panel pad" style="margin-top:14px"><h3 class="side-t">按薄弱度快速切入</h3>' +
      '<div class="acts">' +
      '<button class="btn" data-act="weak25">最薄弱 25 题</button>' +
      '<button class="btn" data-act="random20">随机 20 题</button>' +
      '<button class="btn" data-act="todo20">未做的前 20 题</button>' +
      "</div></div>";
  }

  /* ---------------- 渲染：错题 ---------------- */
  function viewWrong() {
    var rows = QS.filter(function (q) { return S.wrong[q.id]; })
      .sort(function (a, b) { return (S.wrong[b.id].ts || 0) - (S.wrong[a.id].ts || 0); });
    if (!rows.length) {
      return '<h1 class="h1">错题本</h1><p class="sub">答错或点“不会”的题会自动进这里；答对一次即标记为已订正。</p>' +
        '<div class="panel empty"><div class="big">还没有错题</div><div>去练习页做几题，错题会自动收集。</div>' +
        '<div style="margin-top:16px"><button class="btn primary" data-act="mode" data-v="practice">开始练习</button></div></div>';
    }
    var open = rows.filter(function (q) { return !S.wrong[q.id].fixed; });
    var list = rows.map(function (q) {
      var w = S.wrong[q.id], a = S.ans[q.id];
      return '<div class="wrow"><div class="id">' + q.id + '</div><div class="bd">' +
        '<div class="st">' + esc(q.stem).replace(/\*\*/g, "") + "</div>" +
        '<div class="mt"><span class="badge ' + (w.fixed ? "g" : "r") + '">' + (w.fixed ? "已订正" : "错 " + w.n + " 次") + "</span>" +
        '<span>答案 ' + q.answer.join("") + (a && a.sel.length ? " · 上次选 " + a.sel.join("") : "") + "</span>" +
        '<span class="tg">' + esc(q.tag) + "</span>" +
        '<button class="btn sm" data-act="jump" data-id="' + q.id + '">重做</button></div>' +
        "</div></div>";
    }).join("");
    return '<h1 class="h1">错题本</h1>' +
      '<p class="sub">共 ' + rows.length + " 条，其中 <b>" + open.length + "</b> 条未订正。</p>" +
      '<div class="acts" style="margin-bottom:14px">' +
      '<button class="btn primary" data-act="wrongredo">重练未订正（' + open.length + '）</button>' +
      '<button class="btn" data-act="wrongall">练全部错题（' + rows.length + '）</button></div>' +
      '<div class="panel pad">' + list + "</div>";
  }

  /* ---------------- 渲染：速记卡 ---------------- */
  function viewCards() {
    if (!cardDeck.length) return '<div class="panel empty">没有卡片</div>';
    if (cardIdx >= cardDeck.length) cardIdx = 0;
    var q = BY[cardDeck[cardIdx]];
    var opts = q.options.map(function (o) {
      var cls = "";
      return '<div class="row"><span class="k">' + o.k + "</span><span>" + md(o.t) + "</span></div>";
    }).join("");
    var ans = cardOpen ? '<div class="fans"><div class="lab">正确答案 ' + q.answer.join("") + "</div>" +
      q.answer.map(function (k) {
        var o = q.options.filter(function (x) { return x.k === k; })[0];
        return '<div class="ao">' + md(o ? o.t : "") + "</div>";
      }).join("") +
      (q.memory ? '<div class="memo" style="margin-top:14px">' + md(q.memory) + "</div>" : "") +
      (q.traps && q.traps.length ? '<ul class="traps" style="margin-top:10px">' + q.traps.map(function (t) { return "<li>" + md(t) + "</li>"; }).join("") + "</ul>" : "") +
      "</div>" : "";

    return '<h1 class="h1">速记卡</h1>' +
      '<p class="sub">先自己回想答案，再翻面对照“记忆要点 + 易错陷阱”。适合考前 20 分钟过一遍。</p>' +
      '<div class="filters">' +
      '<button class="chip' + (cardCh === "all" ? " on" : "") + '" data-act="cardch" data-v="all">全部</button>' +
      CHS.map(function (c) {
        return '<button class="chip' + (cardCh === c.id ? " on" : "") + '" data-act="cardch" data-v="' + c.id + '">' + esc(c.name) + "</button>";
      }).join("") +
      "</div>" +
      '<div class="flash">' +
      '<div class="qhead"><span class="qno">题 ' + q.id + '</span><span class="tg ty">' + esc(q.type) + '</span><span class="tg">' + esc(q.tag) + "</span>" +
      '<span style="margin-left:auto;font-size:12px;color:var(--ink3)">' + (cardIdx + 1) + " / " + cardDeck.length + "</span></div>" +
      '<div class="fq">' + md(q.stem) + "</div>" +
      '<div class="fopts">' + opts + "</div>" + ans + "</div>" +
      '<div class="qnav">' +
      '<button class="btn sm" data-act="cardprev">← 上一张</button>' +
      '<button class="btn primary" data-act="cardflip">' + (cardOpen ? "收起" : "翻面看答案") + "</button>" +
      '<button class="btn sm" data-act="cardnext">下一张 →</button>' +
      '<button class="btn sm ghost" data-act="cardjump" data-id="' + q.id + '" style="margin-left:auto">去精做这题</button>' +
      "</div>";
  }

  /* ---------------- 渲染：统计 ---------------- */
  function viewStats() {
    var g = overall();
    var chRows = CHS.map(function (c) {
      var st = chStat(c.id);
      var col = st.answered ? (st.acc >= 80 ? "var(--ok)" : st.acc >= 60 ? "var(--amber)" : "var(--bad)") : "var(--ink3)";
      return '<tr data-act="drill" data-ch="' + c.id + '" tabindex="0" role="button" style="cursor:pointer">' +
        "<td>" + esc(c.name) + '<span style="color:var(--ink3);font-size:11.5px"> · ' + c.id + "</span></td>" +
        '<td class="r">' + st.total + "</td><td class=\"r\">" + st.answered + "</td>" +
        '<td class="r"><div class="cellbar"><span style="font-weight:700;color:' + col + '">' + (st.answered ? st.acc + "%" : "—") +
        '</span><div class="bar"><i class="' + barClass(st.acc) + '" style="width:' + (st.answered ? st.acc : 0) + '%"></i></div></div></td></tr>';
    }).join("");

    var tagMap = {};
    QS.forEach(function (q) { (tagMap[q.tag] = tagMap[q.tag] || []).push(q); });
    var weak = Object.keys(tagMap).map(function (t) {
      var st = tagStat(t), wrongN = 0, wrongOpen = 0;
      tagMap[t].forEach(function (q) {
        var w = S.wrong[q.id];
        if (w) { wrongN += w.n; if (!w.fixed) wrongOpen++; }
      });
      return { tag: t, st: st, wrongN: wrongN, wrongOpen: wrongOpen };
    }).filter(function (x) {
      return x.st.answered > 0 && (x.st.acc < 100 || x.wrongN > 0);
    }).sort(function (a, b) {
      return b.wrongOpen - a.wrongOpen || b.wrongN - a.wrongN ||
        a.st.acc - b.st.acc || b.st.answered - a.st.answered;
    }).slice(0, 12);

    var weakHTML = weak.length ? weak.map(function (x) {
      var label = (x.wrongN ? "错 " + x.wrongN + " 次 · " : "") + x.st.acc + "% · 共" + x.st.total;
      return '<button class="tagbtn" data-act="starttag" data-v="' + esc(x.tag) + '">' + esc(x.tag) +
        '<span class="acc ' + (x.st.acc >= 80 && !x.wrongOpen ? "g" : "r") + '">' + label + "</span></button>";
    }).join("") : '<span class="hint">' + (g.answered ? "答过的考点目前没有错题，去练没做过的题" : "还没有作答记录") + "</span>";

    var hist = S.hist.slice(-14).reverse().map(function (h) {
      var d = new Date(h.ts);
      var hh = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
      return '<div class="wrow" style="padding:7px 0"><div class="id">' + h.id + '</div><div class="bd" style="display:flex;gap:10px;align-items:center">' +
        '<span class="badge ' + (h.ok ? "g" : "r") + '">' + (h.ok ? "对" : "错") + "</span>" +
        '<span style="font-size:12.5px;color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc((BY[h.id] ? BY[h.id].stem : "").replace(/\*\*/g, "").slice(0, 42)) + "</span>" +
        '<span style="font-size:11.5px;color:var(--ink3)">' + hh + "</span></div></div>";
    }).join("");

    return '<h1 class="h1">学习统计</h1><p class="sub">正确率按“最近一次作答”计算，重复练习会覆盖旧结果；错题本按累计错误次数计数。</p>' +
      adviceHTML() +
      '<div class="cards" style="margin-bottom:16px">' +
      statCard(g.answered + "/" + TOTAL, "已答进度") +
      statCard(g.answered ? g.acc + "%" : "—", "总体正确率") +
      statCard(String(g.wrongOpen), "待订正错题") +
      statCard(String(g.fav), "收藏题数") +
      "</div>" +
      '<div class="panel pad" style="margin-bottom:14px"><h3 class="side-t">按模块（点行直接练该模块）</h3>' +
      '<table class="tb"><thead><tr><th>模块</th><th class="r">题数</th><th class="r">已答</th><th class="r">正确率</th></tr></thead><tbody>' + chRows + "</tbody></table></div>" +
      '<div class="panel pad" style="margin-bottom:14px"><h3 class="side-t">最需要补的考点（点一下直接练）</h3><div class="tagcloud">' + weakHTML + "</div></div>" +
      '<div class="panel pad" style="margin-bottom:14px"><h3 class="side-t">最近作答</h3>' + (hist || '<span class="hint">暂无</span>') + "</div>" +
      '<div class="panel pad"><h3 class="side-t">数据</h3><div class="acts">' +
      '<button class="btn sm" data-act="export">导出记录（JSON）</button>' +
      '<button class="btn sm" data-act="import">导入记录（JSON）</button>' +
      '<button class="btn sm danger" data-act="reset">清空全部记录</button>' +
      '<input type="file" id="importfile" accept=".json,application/json" style="display:none">' +
      '<span class="hint">记录只存在本机浏览器，换浏览器或清缓存会丢失；换设备用「导出/导入」搬。</span></div></div>';
  }
  function adviceHTML() {
    var g = overall(), items = [];
    var weak = CHS.map(function (c) { return { c: c, st: chStat(c.id) }; })
      .filter(function (x) { return x.st.answered >= 2; })
      .sort(function (a, b) { return a.st.acc - b.st.acc; })[0];
    if (weak && weak.st.acc < 85) {
      items.push({
        t: "最弱模块：<b>" + esc(weak.c.name) + "</b>　正确率 " + weak.st.acc + "%（已答 " + weak.st.answered + "/" + weak.st.total + "）",
        act: "drill", ch: weak.c.id, btn: "练这个模块"
      });
    }
    if (g.wrongOpen) items.push({ t: "有 <b>" + g.wrongOpen + "</b> 道错题还没订正", act: "wrongredo", btn: "重练错题" });
    if (g.answered < TOTAL) items.push({ t: "还有 <b>" + (TOTAL - g.answered) + "</b> 道题没做过", act: "todo20", btn: "做未做的 20 题" });
    if (!items.length) items.push({ t: "全部答过且没有待订正错题——建议用「速记卡」和「速查」过一遍记忆要点", act: "mode2", v: "cards", btn: "去速记卡" });
    return '<div class="panel pad" style="margin-bottom:14px"><h3 class="side-t">建议下一步</h3>' +
      items.map(function (x) {
        var act = x.act === "mode2" ? "mode" : x.act;
        return '<div class="wrow" style="align-items:center;padding:9px 0"><div class="bd" style="font-size:13.8px;line-height:1.6">' + x.t + "</div>" +
          '<button class="btn sm" data-act="' + act + '"' + (x.ch ? ' data-ch="' + x.ch + '"' : "") + (x.v ? ' data-v="' + x.v + '"' : "") + ">" + x.btn + "</button></div>";
      }).join("") + "</div>";
  }

  function statCard(v, l) { return '<div class="panel pad"><div style="font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums">' + esc(v) + '</div><div style="font-size:11.5px;color:var(--ink3)">' + l + "</div></div>"; }

  /* ---------------- 渲染：速查 ---------------- */
  function sheetResults(term) {
    var hit = QS.filter(function (q) {
      if (!term) return true;
      var blob = [q.stem, q.tag, q.memory, (q.traps || []).join(""), q.note, q.analysis].join(" ").toLowerCase();
      return blob.indexOf(term.toLowerCase()) >= 0;
    });
    var groups = CHS.map(function (c) {
      var list = hit.filter(function (q) { return q.ch === c.id; });
      if (!list.length) return "";
      var rows = list.map(function (q) {
        return '<div class="sheet-row"><div class="id" data-act="jump" data-id="' + q.id + '">' + q.id + '</div><div class="tx">' +
          "<b>答案 " + q.answer.join("") + "</b> · " + md(q.memory || "") +
          (q.traps && q.traps.length ? '<div class="hint" style="margin-top:2px">陷阱：' + esc(q.traps.join("；")) + "</div>" : "") +
          '<span class="tg">' + esc(q.tag) + "</span></div></div>";
      }).join("");
      return '<div class="sheet-blk"><h3 class="side-t">' + esc(c.id + " " + c.name) + "（" + list.length + "）</h3>" + rows + "</div>";
    }).join("");
    return (groups || '<div class="panel empty">没有匹配的内容</div>') +
      '<div class="hint" style="margin-top:6px">命中 ' + hit.length + " 题</div>";
  }

  function viewSheet() {
    var tipsHTML = (D.tips || []).map(function (t) {
      var title = t.split("\n")[0].replace(/^#+\s*/, "");
      var rest = t.split("\n").slice(1).join("\n").trim();
      return '<details class="tipbox"><summary>' + esc(title) + '</summary><div class="md">' + md(rest) + "</div></details>";
    }).join("");

    return '<h1 class="h1">考点速查</h1>' +
      '<p class="sub">全部 120 题的“记忆要点 + 易错陷阱”汇总，按模块分组。考前扫一遍，比重做一遍更划算。想打印成纸质清单：Ctrl/⌘+P，折叠块会自动展开。</p>' +
      tipsHTML +
      '<div class="search"><input id="qsearch" type="search" placeholder="搜关键词：Cp / 分辨率 / 震荡期 / GRR…" value="' + esc(searchTerm.trim()) + '"></div>' +
      '<div id="sheetres">' + sheetResults(searchTerm.trim()) + "</div>";
  }

  /* ---------------- 主渲染 ---------------- */
  function render() {
    var app = document.getElementById("app");
    document.getElementById("hud").innerHTML = hudHTML();
    Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-v") === view);
    });
    var html = "";
    if (view === "practice") html = viewPractice();
    else if (view === "drill") html = viewDrill();
    else if (view === "wrong") html = viewWrong();
    else if (view === "cards") html = viewCards();
    else if (view === "stats") html = viewStats();
    else if (view === "sheet") html = viewSheet();
    app.innerHTML = html;
    var si = document.getElementById("qsearch");
    if (si) {
      si.addEventListener("input", function () {
        searchTerm = si.value;
        var box = document.getElementById("sheetres");
        if (box) box.innerHTML = sheetResults(searchTerm.trim());
      });
    }
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var q;

    switch (act) {
      case "mode":
        view = t.getAttribute("data-v"); save();
        if (view === "cards") { cardOpen = false; buildCards(); }
        render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "opt": selectOpt(t.getAttribute("data-k")); break;
      case "submit": submit(); break;
      case "reveal": reveal(); break;
      case "next": goPos(1); break;
      case "prev": goPos(-1); break;
      case "gopos":
        deck.pos = parseInt(t.getAttribute("data-i"), 10);
        syncPick(); save(); render();
        window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "redo":
        pick = { sel: [], done: false, revealed: false };
        var rq = curQ();
        if (rq && deck.rev) delete deck.rev[rq.id];
        render(); break;
      case "star":
        q = parseInt(t.getAttribute("data-id"), 10);
        if (S.fav[q]) delete S.fav[q]; else S.fav[q] = 1;
        save();
        if (filt.scope === "fav" && !S.fav[q]) { buildDeck(); }
        render(); toast(S.fav[q] ? "已收藏" : "已取消收藏"); break;
      case "jump": jumpTo(parseInt(t.getAttribute("data-id"), 10)); break;
      case "ftype": filt.type = t.getAttribute("data-v"); buildDeck(); render(); break;
      case "fscope":
        var sv = t.getAttribute("data-v");
        filt.scope = (sv === "all" || filt.scope === sv) ? "all" : sv;
        buildDeck(); render(); break;
      case "shuffle":
        if (deck.custom) { deck.ids = shuffle(deck.ids); deck.pos = 0; deck.round = {}; pick = { sel: [], done: false, revealed: false }; }
        else { buildDeck({ shuffle: true }); }
        render(); toast("已打乱本组顺序"); break;
      case "all":
        filt = { ch: "all", type: "all", scope: "all" }; buildDeck(); render(); break;
      case "restart":
        deck.ids = shuffle(deck.ids); deck.pos = 0; deck.round = {};
        pick = { sel: [], done: false, revealed: false }; render(); break;
      case "drill":
        filt = { ch: t.getAttribute("data-ch"), type: "all", scope: "all" };
        buildDeck(); view = "practice"; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "starttag":
        var tg = t.getAttribute("data-v");
        filt = { ch: "all", type: "all", scope: "all" };
        var ids = QS.filter(function (x) { return x.tag === tg; }).map(function (x) { return x.id; });
        deck = { ids: ids, pos: 0, round: {}, label: "考点：" + tg, custom: true };
        pick = { sel: [], done: false, revealed: false };
        view = "practice"; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "wrongredo":
        if (t.getAttribute("data-round") === "1") {
          var rw = Object.keys(deck.round).filter(function (k) { return !deck.round[k]; })
            .map(function (k) { return parseInt(k, 10); })
            .filter(function (id) { return !!BY[id]; });
          if (rw.length) {
            deck = { ids: rw, pos: 0, round: {}, label: "本轮错题（" + rw.length + "）", custom: true };
            pick = { sel: [], done: false, revealed: false };
            view = "practice"; save(); render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            break;
          }
        }
        filt = { ch: "all", type: "all", scope: "wrong" }; buildDeck(); view = "practice"; save(); render();
        window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "wrongall":
        var wids = QS.filter(function (x) { return S.wrong[x.id]; }).map(function (x) { return x.id; });
        deck = { ids: wids, pos: 0, round: {}, label: "全部错题", custom: true };
        pick = { sel: [], done: false, revealed: false };
        view = "practice"; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "weak25":
        var scored = QS.map(function (x) {
          var a = S.ans[x.id], w = S.wrong[x.id];
          var sc = (a ? (a.ok ? 0 : 3) : 1) + (w ? Math.min(w.n, 3) : 0);
          return { id: x.id, sc: sc };
        }).sort(function (a, b) { return b.sc - a.sc; }).slice(0, 25).map(function (x) { return x.id; });
        deck = { ids: scored, pos: 0, round: {}, label: "最薄弱 25 题", custom: true };
        pick = { sel: [], done: false, revealed: false };
        view = "practice"; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "random20":
        deck = { ids: shuffle(QS.map(function (x) { return x.id; })).slice(0, 20), pos: 0, round: {}, label: "随机 20 题", custom: true };
        pick = { sel: [], done: false, revealed: false };
        view = "practice"; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "todo20":
        deck = { ids: QS.filter(function (x) { return !S.ans[x.id]; }).map(function (x) { return x.id; }).slice(0, 20), pos: 0, round: {}, label: "未做 20 题", custom: true };
        pick = { sel: [], done: false, revealed: false };
        view = "practice"; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "cardnext": if (cardDeck.length) { cardIdx = (cardIdx + 1) % cardDeck.length; } cardOpen = false; render(); break;
      case "cardprev": if (cardDeck.length) { cardIdx = (cardIdx - 1 + cardDeck.length) % cardDeck.length; } cardOpen = false; render(); break;
      case "cardflip": cardOpen = !cardOpen; render(); break;
      case "cardch":
        cardCh = t.getAttribute("data-v"); buildCards(); cardIdx = 0; cardOpen = false; render(); break;
      case "cardjump": jumpTo(parseInt(t.getAttribute("data-id"), 10)); break;
      case "export":
        var blob = new Blob([JSON.stringify({ ans: S.ans, wrong: S.wrong, fav: S.fav, hist: S.hist }, null, 1)], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "六西格玛120题-学习记录.json"; a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        break;
      case "import":
        var fi = document.getElementById("importfile");
        if (fi) fi.click();
        else toast("导入控件未就绪，请刷新后再试");
        break;
      case "reset":
        if (confirm("确定清空全部作答记录、错题本和收藏？此操作不可撤销。")) {
          S = { ans: {}, wrong: {}, fav: {}, hist: [], ui: { mode: "practice" } };
          save(); buildDeck(); render(); toast("已清空");
        }
        break;
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.getAttribute("data-act") === "fch") {
      filt.ch = e.target.value; buildDeck(); render();
    }
    if (e.target.id === "importfile") {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var o;
        try { o = JSON.parse(String(rd.result)); } catch (err) { toast("导入失败：不是有效的 JSON"); return; }
        if (!o || typeof o !== "object" || !(o.ans || o.wrong || o.fav || o.hist)) { toast("导入失败：不是本页导出的记录文件"); return; }
        if (!confirm("导入会覆盖当前全部作答记录、错题本和收藏，确定？")) return;
        try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (err) { toast("导入失败：浏览器拒绝写入"); return; }
        location.reload();
      };
      rd.readAsText(f);
    }
  });

  function buildCards() {
    cardDeck = QS.filter(function (q) { return cardCh === "all" || q.ch === cardCh; }).map(function (q) { return q.id; });
    if (cardIdx >= cardDeck.length) cardIdx = 0;
  }

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;   // Ctrl/⌘/Alt 组合键交还浏览器（Ctrl+A 全选、Ctrl+F 查找）
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
    if (e.target.isContentEditable) return;
    var k = e.key.toUpperCase();
    if (view === "practice" && deck.ids.length && deck.pos < deck.ids.length) {
      var q = curQ();
      if (!pick.done) {
        if ("ABCD".indexOf(k) >= 0 && k.length === 1) { e.preventDefault(); selectOpt(k); return; }
        if (k.length === 1 && "1234".indexOf(k) >= 0) { e.preventDefault(); selectOpt("ABCD".charAt(parseInt(k, 10) - 1)); return; }
        if (e.key === "Enter" && q && q.type === "多选") { e.preventDefault(); submit(); return; }
        if (k === "S") { e.preventDefault(); reveal(); return; }
      } else if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); goPos(1); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); goPos(-1); return; }
      if (k === "F") { e.preventDefault(); if (S.fav[q.id]) delete S.fav[q.id]; else S.fav[q.id] = 1; save(); render(); return; }
    }
    if (view === "cards") {
      if (e.key === " ") { e.preventDefault(); cardOpen = !cardOpen; render(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); cardIdx = (cardIdx + 1) % cardDeck.length; cardOpen = false; render(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); cardIdx = (cardIdx - 1 + cardDeck.length) % cardDeck.length; cardOpen = false; render(); }
    }

  });

  /* ---------------- 启动 ---------------- */
  // 打印时自动展开折叠的提示块（Chrome 下 CSS 无法强制展开 details）
  window.addEventListener("beforeprint", function () {
    Array.prototype.forEach.call(document.querySelectorAll("details"), function (d) {
      if (!d.open) { d.classList.add("was-closed"); d.open = true; }
    });
  });
  window.addEventListener("afterprint", function () {
    Array.prototype.forEach.call(document.querySelectorAll("details.was-closed"), function (d) {
      d.open = false; d.classList.remove("was-closed");
    });
  });

  buildCards();
  // 恢复上次的筛选条件与题号（专项/临时题组不恢复，避免题组对不上）
  if (S.ui && S.ui.filt) filt = S.ui.filt;
  buildDeck();
  if (S.ui && typeof S.ui.pos === "number" && S.ui.pos > 0 && S.ui.pos < deck.ids.length) deck.pos = S.ui.pos;
  syncPick();
  render();
})();

</script>
</body>
</html>
