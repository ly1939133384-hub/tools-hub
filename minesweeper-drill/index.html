<style>

    --cell-size: 44px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);

    padding: 24px 16px 60px;

  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 16px; }
  .pattern-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .pattern-tabs button {
    border: 1px solid #ccc; background: #fff; padding: 6px 14px;
    border-radius: 20px; cursor: pointer; font-size: 13px; color: #555;
  }
  .pattern-tabs button.active { background: var(--num-blue); color: #fff; border-color: var(--num-blue); }
  .pattern-tabs button.all {}
  .card {
    background: var(--panel); border-radius: 12px; padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px;
  }
  .puzzle-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .puzzle-name { font-size: 17px; font-weight: bold; }
  .puzzle-count { color: #888; font-size: 12px; }
  .goal-bar {
    background: #eef5fb; border: 1px solid #cfe0f0; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; color: #2c5f8a; margin-bottom: 14px; line-height: 1.6;
  }
  .goal-bar b { color: var(--num-blue); }
  .board { display: inline-grid; gap: 2px; background: #bdbdbd; padding: 4px; border-radius: 6px; }
  .cell {
    width: var(--cell-size); height: var(--cell-size);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: bold; user-select: none; cursor: default;
    border-radius: 3px;
  }
  .cell.num   { background: #5b8db8; color: #fff; }
  .cell.safe  { background: #d9d9d9; color: #9aa; }
  .cell.unknown { background: var(--unk); cursor: pointer; }
  .cell.unknown:hover { background: var(--unk-hover); }
  .cell.mine-flag { background: #2b2b2b; color: #ff6b6b; font-size: 20px; }
  .cell.mark-mine { background: var(--mine-flag); color: #fff; }
  .cell.mark-safe { background: var(--safe); color: #fff; }
  .cell.wrong { background: #ffd1d1 !important; color: #c0392b; animation: shake .3s; }
  .cell.locked { cursor: default; opacity: .45; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .status-line { margin-top: 14px; font-size: 14px; min-height: 24px; line-height: 24px; }
  .status-line .ok { color: var(--safe); font-weight: bold; }
  .status-line .err { color: var(--mine); font-weight: bold; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  .btn.primary { background: var(--num-blue); color: #fff; }
  .btn.secondary { background: #e8e8e8; color: #333; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .hint-box {
    margin-top: 14px; background: #fdf6e3; border: 1px solid #e8d9a0;
    border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.8; display: none;
  }
  .hint-box.show { display: block; }
  .hint-box h3 { font-size: 14px; margin-bottom: 6px; color: #8a6d1a; }
  .pass-box {
    display: none; margin-top: 14px; background: #eafaf1; border: 1px solid #bfe8d2;
    border-radius: 8px; padding: 14px 16px; font-size: 14px; line-height: 1.8;
  }
  .pass-box.show { display: block; }
  .pass-box h3 { color: var(--safe); margin-bottom: 6px; }
  .reason { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #c8e6d3; font-size: 13px; color: #444; }
  .stats { margin-top: 20px; font-size: 13px; color: #777; line-height: 1.8; }
  .footer { margin-top: 30px; font-size: 12px; color: #aaa; text-align: center; }
  @media (max-width: 640px) {
    :root { --cell-size: 32px; }
    body { padding: 12px 6px 40px; }
    .card { padding: 12px; }
    .cell { font-size: 14px; }
    .puzzle-name { font-size: 15px; }
    .goal-bar { font-size: 12px; }
    .btn { padding: 8px 12px; font-size: 13px; }
  }

  .legend { display: flex; gap: 14px; font-size: 12px; color: #666; margin-top: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
</style>

  "canonical_key": "{\"H\": 5, \"W\": 7, \"c\": [[[0, 2], 2], [[0, 4], 2], [[1, 0], 2], [[1, 2], 5], [[1, 5], 2], [[2, 4], 3], [[3, 1], 2], [[3, 2], 3]], \"s\": [[0, 5], [0, 6], [3, 0], [3, 4], [4, 0], [4, 1], [4, 2], [4, 3]], \"m\": [[0, 1]]}"
 }
];

// ---------- 状态 ----------
let cur = 0;           // 当前题下标（题库序）
let filter = "all";    // 难度级筛选
let marked = {};       // 当前题 {"r,c": "mine"|"safe"}
let finished = false;
let wrongCount = 0;    // 本局（单次浏览会话）每题错误数，写进统计
let sessionStats = {}; // {puzzleId: {ok:0, err:0, pass:false}}

function order() {
  return PUZZLES.map((p, i) => i).filter(i =>
    filter === "all" || PUZZLES[i].level === filter
  );
}

function render() {
  const idx = order()[cur];
  const p = PUZZLES[idx];
  const board = document.getElementById("board");
  const pName = document.getElementById("pName");
  const pCount = document.getElementById("pCount");
  pName.textContent = `[${p.level}] ${p.name}`;
  pCount.textContent = `第 ${cur + 1} / ${order().length} 题`;
  // 目标总结
  const mines = Object.entries(p.targets).filter(([, v]) => v === "mine");
  const safes = Object.entries(p.targets).filter(([, v]) => v === "safe");
  const minesN = (p.mines || []).length;
  const purposeHtml = p.purpose ? `<span style="color:#8a6d1a">训练目的：${p.purpose}</span> · ` : "";
  document.getElementById("goalBar").innerHTML =
    `🎯 ${purposeHtml}本题目标：找出 <b>${mines.length} 个必雷格</b>（在数字旁标雷）${safes.length ? ` + <b>${safes.length} 个必空格</b>` : ""}。` +
    (minesN ? `<br>🧮 先看明雷（🚩 <b>${minesN} 颗</b>）：数字要先「减掉」自己邻域里的明雷数，再做推理——这是减法归约。` : "") +
    `左键=标空，右键=标雷，全部标对即过关。`;
  // 画板
  board.innerHTML = "";
  board.style.gridTemplateColumns = `repeat(${p.W}, var(--cell-size))`;
  for (let r = 0; r < p.H; r++) {
    for (let c = 0; c < p.W; c++) {
      const key = `${r},${c}`;
      const div = document.createElement("div");
      div.className = "cell";
      div.dataset.key = key;
      if (key in p.cells) {
        div.classList.add("num");
        div.textContent = p.cells[key];
      } else if (p.safe.some(([sr, sc]) => sr === r && sc === c)) {
        div.classList.add("safe");
        div.textContent = "·";
      } else if ((p.mines || []).some(([mr, mc]) => mr === r && mc === c)) {
        div.classList.add("mine-flag");
        div.textContent = "🚩";
        div.title = "明雷（已知是雷，不用标）";
      } else {
        div.classList.add("unknown");
        div.title = "左键=标必空，右键=标必雷";
        div.addEventListener("click", () => mark(key, "safe", div));
        div.addEventListener("contextmenu", (e) => { e.preventDefault(); mark(key, "mine", div); });
      }
      board.appendChild(div);
    }
  }
  // 恢复已标记
  for (const [key, kind] of Object.entries(marked)) {
    const div = board.querySelector(`[data-key="${key}"]`);
    if (div) applyMark(div, kind);
  }
  document.getElementById("status").innerHTML = "点击未知格开始：左键=必空，右键=必雷";
  document.getElementById("passBox").classList.remove("show");
  document.getElementById("hintBox").classList.remove("show");
  document.getElementById("btnShow").disabled = false;
  updateStatsLine();
}

function applyMark(div, kind) {
  div.classList.remove("unknown", "mark-mine", "mark-safe");
  div.classList.add(kind === "mine" ? "mark-mine" : "mark-safe");
  div.textContent = kind === "mine" ? "🚩" : "✓";
}

function mark(key, kind, div) {
  if (finished) return;
  const p = PUZZLES[order()[cur]];
  // 已是定式目标格？
  const isTarget = key in p.targets;
  if (!isTarget) {
    // 非目标格：信息不足，轻提示不判错
    flash(div, "这类格暂时无法唯一确定，先不管它", false);
    return;
  }
  marked[key] = kind;
  applyMark(div, kind);
  const correct = p.targets[key] === kind;
  if (!correct) {
    wrongCount++;
    sessionStats[p.id] = sessionStats[p.id] || { ok: 0, err: 0 };
    sessionStats[p.id].err++;
    div.classList.add("wrong");
    setTimeout(() => {
      div.classList.remove("wrong");
      div.classList.remove("mark-mine", "mark-safe");
      div.classList.add("unknown");
      div.textContent = "";
      delete marked[key];
    }, 500);
    flash(div, p.targets[key] === "mine" ? "错了！这格是「必雷」→ 应点右键标雷" : "错了！这格是「必空」→ 应点左键标空", true);
    return;
  }
  sessionStats[p.id] = sessionStats[p.id] || { ok: 0, err: 0 };
  sessionStats[p.id].ok++;
  updateStatsLine();
  // 过关判定
  const stillNeed = Object.keys(p.targets).filter(k => !marked[k]);
  if (stillNeed.length === 0) {
    finished = true;
    const pb = document.getElementById("passBox");
    pb.innerHTML = `<h3>✅ 过关！${p.name}</h3>${(p.reason || "").split("\n").map(s => s ? `<div>${s}</div>` : "").join("")}`;
    pb.classList.add("show");
    document.getElementById("btnShow").disabled = true;
    document.getElementById("status").innerHTML = `<span class="ok">全部目标格标记正确，过关！</span>`;
    saveStats();
  } else {
    document.getElementById("status").innerHTML =
      `还剩 <b>${stillNeed.length}</b> 个目标格：${stillNeed.map(k => {
        const kr = k.split(",");
        return `(${+kr[0] + 1},${+kr[1] + 1})${p.targets[k] === "mine" ? "雷" : "空"}`;
      }).join("、")}`;
  }
}

function flash(div, msg, isErr) {
  const st = document.getElementById("status");
  st.innerHTML = isErr ? `<span class="err">${msg}</span>` : msg;
}

function updateStatsLine() {
  const idx = order()[cur];
  const p = PUZZLES[idx];
  const s = sessionStats[p.id];
  document.getElementById("stats").innerHTML = s
    ? `本题：✅ ${s.ok} 次正确 · ❌ ${s.err} 次错误` + (finished ? ` · 🎉 已过关` : "")
    : "本题：还没开始";
}

function saveStats() {
  try {
    let all = {};
    try { all = JSON.parse(localStorage.getItem("ms-drill-stats") || "{}"); } catch (e) {}
    all[PUZZLES[order()[cur]].id] = all[PUZZLES[order()[cur]].id] || {};
    all[PUZZLES[order()[cur]].id].passCount = (all[PUZZLES[order()[cur]].id].passCount || 0) + 1;
    localStorage.setItem("ms-drill-stats", JSON.stringify(all));
  } catch (e) {
    // localStorage 不可用（DLP 拦截等）→ 静默降级为无记忆模式
  }
}

// ---------- 按钮 ----------
document.getElementById("btnNext").addEventListener("click", () => {
  if (cur < order().length - 1) {
    cur++;
    marked = {}; finished = false;
    render();
  } else {
    cur = 0; marked = {}; finished = false;
    render();
    alert("已刷完一轮 🎉 五题全部过关了吗？");
  }
});
document.getElementById("btnReset").addEventListener("click", () => {
  marked = {}; finished = false; render();
});
document.getElementById("btnShow").addEventListener("click", () => {
  const p = PUZZLES[order()[cur]];
  // 显示答案：把目标格标出来（不判对错，纯展示）
  const board = document.getElementById("board");
  for (const [key, kind] of Object.entries(p.targets)) {
    const div = board.querySelector(`[data-key="${key}"]`);
    if (div && !div.classList.contains("num") && !div.classList.contains("safe")) {
      applyMark(div, kind);
    }
  }
  const pb = document.getElementById("passBox");
  pb.innerHTML = `<h3>📖 答案（自动标记目标格）</h3>${(p.reason || "").split("\n").map(s => s ? `<div>${s}</div>` : "").join("")}`;
  pb.classList.add("show");
});
document.getElementById("btnHint").addEventListener("click", () => {
  const p = PUZZLES[order()[cur]];
  const hb = document.getElementById("hintBox");
  const first = Object.keys(p.targets)[0];
  const [r, c] = first.split(",");
  hb.innerHTML = `<h3>💡 提示</h3><div>先看数字 <b>${p.cells ? "" : ""}</b>——找出「周围未知格最少」的数字开始推理。例：${p.name.includes("1-2-1") ? "两端的 1 各只认 2 个未知格，它们的雷位其实已经被互相逼死了" : "比较 1 和 2 差的那一格（多出来的一侧）就是雷"}</div>`;
  hb.classList.add("show");
});

// ---------- 页签 ----------
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  filter = btn.dataset.lv;
  cur = 0; marked = {}; finished = false;
  render();
});

render();
</script>
</body>
</html>
