<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>六西格玛黑带 120 题 · 自测答题</title>
<style>
:root{
  --bg:#f4f4ef;
  --panel:#ffffff;
  --ink:#1c2321;
  --ink2:#5a6663;
  --ink3:#8a9491;
  --line:#e3e2da;
  --line2:#d3d2c8;
  --accent:#2b6a5c;
  --accent-2:#3d8574;
  --accent-soft:#e9f1ed;
  --ok:#1f7a4d;
  --ok-soft:#e9f5ee;
  --bad:#b23a2e;
  --bad-soft:#fbedea;
  --amber:#a97c15;
  --amber-soft:#fdf5e2;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","SimSun","Source Han Serif SC",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --r:14px;
  --shadow:0 1px 2px rgba(28,35,33,.04),0 8px 24px -16px rgba(28,35,33,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #e8eee9 0%, rgba(232,238,233,0) 60%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
::selection{background:#cfe3da}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(250,250,246,.97);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand small{display:block;font-weight:400;color:var(--ink3);font-size:11px;letter-spacing:.06em}
.modes{display:flex;gap:2px;background:#eeeee8;padding:3px;border-radius:10px;margin-left:auto;flex-wrap:wrap}
.modes button{
  border:0;background:transparent;padding:7px 13px;border-radius:8px;color:var(--ink2);
  font-size:13.5px;font-weight:600;transition:.16s;white-space:nowrap
}
.modes button:hover{color:var(--ink);background:#f6f6f1}
.modes button.on{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hud{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink);font-size:14px}
.hud .sep{width:1px;height:20px;background:var(--line2)}
@media(max-width:600px){
  .chip{padding:5px 10px;font-size:12px}
  .filters{gap:6px}
  .sel select{padding:6px 26px 6px 10px;font-size:12.5px}
  .btn.sm{padding:5px 9px;font-size:12px}
  .stem{font-size:17px}
  .aside .panel.pad{padding:12px 14px}
}
@media(max-width:820px){
  .topbar-in{padding:8px 12px;gap:8px}
  .modes{order:3;width:100%;margin:0;overflow-x:auto;flex-wrap:nowrap}
  .hud{margin-left:auto;gap:10px}
  .brand small{display:none}
}

/* ---------- 布局 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
@media(max-width:820px){.wrap{padding:14px 12px 90px}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:22px;align-items:start}
@media(max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
.aside{position:sticky;top:74px;display:flex;flex-direction:column;gap:14px}
@media(max-width:980px){.aside{position:static;order:2}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}

/* ---------- 筛选条 ---------- */
.deckbar{height:3px;background:#e6e6dd;border-radius:99px;margin:-3px 0 13px;overflow:hidden}
.deckbar>i{display:block;height:100%;background:linear-gradient(90deg,#2b6a5c,#7fb2a4);border-radius:99px;transition:width .3s}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{
  appearance:none;border:1px solid var(--line2);background:#fff;border-radius:9px;
  padding:7px 30px 7px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;max-width:220px
}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.chip{
  border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 12px;
  font-size:12.5px;font-weight:600;color:var(--ink2);transition:.14s
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.6;font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.fsep{width:1px;height:20px;background:var(--line2);margin:0 3px}
.filters .chip.scope{border-radius:8px}

/* ---------- 题卡 ---------- */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.tg{font-size:11.5px;color:var(--ink2);background:#f2f2ec;border-radius:6px;padding:3px 8px}
.tg.ty{color:#7a5a12;background:var(--amber-soft)}
.star{margin-left:auto;border:0;background:transparent;font-size:18px;line-height:1;color:#cfd3cd;padding:8px 10px;margin:-6px -6px -6px auto;border-radius:8px;min-width:38px;min-height:38px;cursor:pointer}
.star.on{color:#e0a923}
.star:hover{color:#e0a923;background:#f6f4ea}

.stem{font-family:var(--serif);font-size:19.5px;line-height:1.75;margin:4px 0 18px;letter-spacing:.01em;overflow-wrap:anywhere}
.stem b{font-weight:700;color:#12312a;background:linear-gradient(transparent 62%, #dcece4 62%)}
@media(max-width:600px){.stem{font-size:17.5px}}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1.4px solid var(--line2);border-radius:11px;padding:12px 14px;
  transition:.14s;line-height:1.6
}
.opt:hover:not(.locked){border-color:var(--accent-2);background:#fbfdfc;transform:translateX(1px)}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f1ea;color:var(--ink2);
  display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;font-weight:700;margin-top:1px
}
.opt .t{flex:1;min-width:0}
.opt .mk{flex:0 0 auto;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;display:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.correct .mk{display:inline-block;color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.wrong .mk{display:inline-block;color:var(--bad)}
.opt.missed{border-color:var(--ok);border-style:dashed;background:var(--ok-soft)}
.opt.missed .mk{display:inline-block;color:var(--ok)}
.opt .why{display:block;font-size:12.5px;color:var(--ink2);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.09)}

.acts{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{
  border:1.4px solid var(--line2);background:#fff;border-radius:10px;padding:9px 16px;
  font-size:14px;font-weight:600;transition:.14s;display:inline-flex;align-items:center;gap:6px
}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#235a4e}
.btn.primary:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:#e8c9c5}
.hint{font-size:12px;color:var(--ink3)}
.fb-note{margin:10px 0 0;padding:8px 11px;border-radius:8px;background:var(--bad-soft);color:#8d3227;font-size:13px;line-height:1.65}
.fb-note b{font-family:var(--mono)}

/* ---------- 判题反馈 ---------- */
.fb{margin-top:18px;border-radius:12px;overflow:hidden;border:1px solid var(--line);animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fb-h{display:flex;align-items:center;gap:10px;padding:11px 14px;font-weight:700;font-size:14px}
.fb.ok .fb-h{background:var(--ok-soft);color:var(--ok)}
.fb.bad .fb-h{background:var(--bad-soft);color:var(--bad)}
.fb-h .res{font-size:15px}
.fb-h .ans{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.7);padding:2px 9px;border-radius:6px}
.fb-body{padding:2px 15px 15px;background:#fff}
.blk{margin-top:13px}
.blk-t{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.blk-t::after{content:"";flex:1;height:1px;background:var(--line)}
.md{font-size:14px;line-height:1.78;color:#28312f;overflow-wrap:anywhere}
.md p{margin:.3em 0}
.md ul{margin:.25em 0 .4em;padding-left:1.2em}
.md li{margin:.16em 0}
.md b{color:#12312a}
.md code{font-family:var(--mono);font-size:12.5px;background:#f2f2ec;padding:1px 5px;border-radius:4px}
.md-tb{width:100%;border-collapse:collapse;margin:.55em 0 .7em;font-size:13px;line-height:1.5;table-layout:auto}
.md-tb th,.md-tb td{border:1px solid var(--line2);padding:6px 9px;text-align:left;vertical-align:top}
.md-tb th{background:#f4f3ea;font-weight:700;color:#12312a;white-space:nowrap}
.md-tb tbody tr:nth-child(even){background:#fbfaf4}
@media(max-width:600px){
  .md-tb{table-layout:fixed;width:100%;font-size:12px}
  .md-tb th,.md-tb td{padding:5px 6px;word-break:break-word;overflow-wrap:anywhere}
  .md-tb th{white-space:normal}
}
.memo{
  background:var(--amber-soft);border-left:3px solid #d9a92c;border-radius:0 8px 8px 0;
  padding:10px 13px;font-size:14px;line-height:1.7;color:#5c4708
}
.traps{list-style:none;padding:0;margin:0}
.traps li{position:relative;padding-left:22px;margin:.32em 0;font-size:13.8px;color:#7a3229;line-height:1.7}
.traps li::before{content:"!";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--bad-soft);color:var(--bad);font-size:10px;font-weight:800;display:grid;place-items:center;border:1px solid #edc8c2}
.note{background:#f7f8f5;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:13.5px;color:var(--ink2)}
.rel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rel button{font-size:12px;border:1px solid var(--line2);background:#fff;border-radius:7px;padding:3px 9px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rel button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- 底部导航 ---------- */
.qnav{display:flex;align-items:center;gap:10px;margin-top:16px}
.qnav .pos{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-left:auto}

/* ---------- 侧栏 ---------- */
.side-t{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--ink3);margin:0 0 10px}
.gridno{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px;max-height:245px;overflow:auto;padding-right:4px;scrollbar-width:thin}
.gn{
  aspect-ratio:1;border:1px solid var(--line2);background:#fff;border-radius:6px;
  font-family:var(--mono);font-size:11px;display:grid;place-items:center;color:var(--ink2);
  font-variant-numeric:tabular-nums;transition:.12s;padding:0
}
.gn:hover{border-color:var(--accent);color:var(--accent)}
.gn.ok{background:var(--ok-soft);border-color:#bcdccb;color:#186b42}
.gn.bad{background:var(--bad-soft);border-color:#eec9c3;color:var(--bad)}
.gn.cur{outline:2px solid var(--accent);outline-offset:1px;font-weight:800}
.gn.todo{background:#fbfbf7;color:#a7aeaa}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink3);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini div{background:#f8f8f3;border-radius:9px;padding:9px 10px}
.mini b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mini span{font-size:11px;color:var(--ink3)}

/* ---------- 考点 / 统计 ---------- */
.h1{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--ink2);font-size:13.5px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.chcard{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left;transition:.15s;box-shadow:var(--shadow)}
.chcard:hover{border-color:var(--accent-2);transform:translateY(-1px)}
.chcard .nm{font-weight:700;font-size:14.5px;margin-bottom:2px}
.chcard .meta{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:99px;background:#ecece5;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar>i.low{background:#c9772b}
.bar>i.bad{background:var(--bad)}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px}
.taggroup{margin:0 0 14px}
.taggroup h4{margin:0 0 7px;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--ink3);display:flex;align-items:center;gap:8px}
.taggroup h4::after{content:"";flex:1;height:1px;background:var(--line)}
.tagbtn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;transition:.13s}
.tagbtn:hover{border-color:var(--accent);color:var(--accent)}
.tagbtn .acc{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:-.01em}
.tagbtn .acc.g{color:var(--ok)}
.tagbtn .acc.r{color:var(--bad)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th.r{text-align:right}
table.tb th{text-align:left;font-size:11.5px;letter-spacing:.08em;color:var(--ink3);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--line)}
table.tb td{padding:7px 8px;border-bottom:1px solid #f1f1ea;font-variant-numeric:tabular-nums}
table.tb tr:last-child td{border-bottom:0}
table.tb td.r{text-align:right}
.cellbar{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.cellbar .bar{width:64px;margin:0;flex:0 0 64px}
.cellbar span{min-width:38px}

/* ---------- 错题 / 速记卡 / 速查 ---------- */
.wrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f1f1ea}
.wrow:last-child{border-bottom:0}
.wrow .id{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:0 0 34px;padding-top:2px}
.wrow .bd{flex:1;min-width:0}
.wrow .st{font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrow .mt{font-size:11.5px;color:var(--ink3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px}
.badge.r{background:var(--bad-soft);color:var(--bad)}
.badge.g{background:var(--ok-soft);color:var(--ok)}
.badge.n{background:#f1f1ea;color:var(--ink2)}

.flash{
  min-height:330px;display:flex;flex-direction:column;justify-content:center;
  padding:26px 24px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  position:relative;overflow:hidden
}
.flash::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),#9fc3b6)}
.flash .fq{font-family:var(--serif);font-size:18.5px;line-height:1.72}
.flash .fopts{margin-top:14px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink2)}
.flash .fopts .row{display:flex;gap:8px}
.flash .fopts p{display:inline;margin:0}
.flash .fopts .row+.row{margin-top:2px}
.flash .fopts .k{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:0 0 16px}
.flash .fans{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2);animation:rise .2s ease}
.flash .fans .lab{font-size:11.5px;letter-spacing:.1em;font-weight:800;color:var(--ok);margin-bottom:8px}
.flash .fans .ao{font-size:14px;margin:.25em 0;line-height:1.6}
.flash .fans .ao b{font-family:var(--mono);color:var(--ok);margin-right:6px}

.sheet-blk{margin-bottom:18px}
.sheet-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted #e8e8e0;font-size:13.5px;line-height:1.72}
.sheet-row .id{font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:0 0 36px;padding-top:3px;cursor:pointer}
.sheet-row .id:hover{text-decoration:underline}
.sheet-row .tx p{display:inline;margin:0}
.sheet-row .tx b{color:#12312a}
.sheet-row .tx .tg{font-size:11px;margin-left:6px}
.search{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.search input{
  flex:1;border:1px solid var(--line2);border-radius:10px;padding:9px 13px;font-size:14px;font-family:inherit;background:#fff;outline:none
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
details.tipbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:12px}
details.tipbox summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:14px;color:var(--accent)}
details.tipbox .md{padding-bottom:14px}

.empty{text-align:center;padding:46px 20px;color:var(--ink3)}
.empty .big{font-size:15px;color:var(--ink2);margin-bottom:6px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2);background:#fff}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 30px;color:var(--ink3);font-size:11.5px;line-height:1.8}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
  background:#1c2321;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;
  transition:.22s;pointer-events:none;z-index:99;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 打印（速查页打印成纸质清单） ---------- */
@media print{
  body{background:#fff}
  .topbar,.filters,.search,.toast,.foot,.acts,.deckbar,.qnav,.aside{display:none !important}
  .wrap{padding:0;max-width:none}
  .panel,details.tipbox{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .sheet-row{break-inside:avoid}
  details.tipbox>summary{list-style:none}
  details.tipbox .md{display:block !important}
  details.tipbox::details-content{content-visibility:visible !important}
}

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="dot"></span>
      <div>六西格玛黑带 120 题
        <small>样题精解 · 自测答题版</small>
      </div>
    </div>
    <nav class="modes">
