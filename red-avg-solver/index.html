<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红均格反推 V2 · 俱乐大玩家</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #d9dee5;
    --text: #22272e;
    --sub: #6b7785;
    --accent: #e8590c;
    --accent-dark: #c74e0a;
    --green: #188038;
    --green-bg: #e6f4ea;
    --warn-bg: #fff8e6;
    --warn-line: #f0c36d;
    --err-bg: #fdecea;
    --err-line: #f5b5b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 12px 60px;
    font-size: 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; line-height: 1.4; }
  .subtitle { color: var(--sub); font-size: 14px; margin: 4px 0 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .card h2 { font-size: 18px; margin-bottom: 10px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 14px; color: var(--sub); margin-bottom: 4px; }
  input[type=text], input[type=number], select {
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid #b6c2cf;
    border-radius: 8px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid rgba(232,89,12,.25); border-color: var(--accent); }
  .inline-fields { display: flex; gap: 8px; flex-wrap: wrap; }
  .inline-fields .field { flex: 1 1 140px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 8px 16px;
    border: none; border-radius: 8px;
    font-size: 16px; font-family: inherit; cursor: pointer;
    background: #e8ebf0; color: var(--text); text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.green { background: var(--green); color: #fff; }
  .btn.danger { background: #fff; color: #c62828; border: 1px solid #e0a0a0; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .constraint-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: #eef1f5; border: 1px solid #d4dae1; border-radius: 20px;
    padding: 4px 6px 4px 12px; font-size: 14px;
  }
  .tag button {
    width: 28px; height: 28px; min-height: 28px;
    border: none; border-radius: 50%; background: #d8dee6;
    color: #555; font-size: 14px; cursor: pointer; line-height: 1;
  }
  .result-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .count { font-size: 22px; font-weight: 700; }
  .count .num { color: var(--accent); }
  .stage-badge {
    display: inline-block; margin-top: 4px; padding: 2px 10px;
    background: #eef1f5; border: 1px solid #d4dae1; border-radius: 20px;
    color: var(--sub); font-size: 13px;
  }
  .warn { background: var(--warn-bg); border: 1px solid var(--warn-line); color: #7a5a00; padding: 8px 12px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
  .err { background: var(--err-bg); border: 1px solid var(--err-line); color: #b42318; padding: 8px 12px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
  .ok { background: #e8f5e9; border: 1px solid #b7dfb9; color: #1e6b2e; padding: 8px 12px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
  .status { color: var(--sub); font-size: 14px; margin-top: 6px; min-height: 22px; }
  .stats { margin-top: 10px; border: 1px solid #e1e5ea; border-radius: 8px; overflow: hidden; }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    min-height: 40px; padding: 6px 12px;
    border-bottom: 1px solid #eef1f5; background: #fbfcfe; font-size: 15px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row.total { background: #f2f4f8; font-weight: 700; }
  .cand-list { margin-top: 10px; }
  .cand-row {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 44px; padding: 6px 10px;
    border: 1px solid #e1e5ea; border-radius: 8px; margin-bottom: 6px;
    background: #fbfcfe; font-size: 16px;
  }
  .cand-row .combo { font-family: Consolas, Menlo, monospace; }
  .cand-row.single { background: var(--green-bg); border-color: #7fd1a0; font-weight: 600; }
  .cand-row .copy-btn { min-height: 36px; padding: 4px 10px; font-size: 14px; }
  .truncated { color: #b26a00; font-size: 14px; margin-top: 8px; }
  .collapse-btn { margin-top: 10px; }
  .footer { text-align: center; color: #999; font-size: 12px; margin-top: 28px; }
  .manual-copy {
    width: 100%; min-height: 80px; margin-top: 8px; padding: 8px;
    border: 1px solid #b6c2cf; border-radius: 8px; font-size: 14px;
    font-family: Consolas, Menlo, monospace;
  }
  @media (max-width: 480px) {
    body { padding: 12px 6px 40px; }
    .card { padding: 12px; }
    h1 { font-size: 21px; }
    .btn-row .btn { flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔴 红均格反推 V2</h1>
  <div class="subtitle">俱乐大玩家 · 清单多重集合取子集 · 两阶段披露 · 逐步约束收敛</div>

  <div class="card">
    <h2>⚙️ 清单与红均数</h2>
    <div class="field">
      <label for="templateSel">预设模板</label>
      <select id="templateSel">
        <option value="full">完整集合（1,2,3,4,6,8,9,12,15,16）</option>
        <option value="concise">精简集合（1,2,3,4,6,8,12）</option>
      </select>
    </div>
    <div class="field">
      <label for="SInput">格子数清单（逗号分隔，可重复，如 1,2,2,3,5）</label>
      <input id="SInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="1,2,2,3,5,8,9,12">
    </div>
    <div class="field">
      <label for="rInput">红均数 r（百分位直接舍去，如 2.56 按 2.5）</label>
      <input id="rInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="例如 2.5">
    </div>
  </div>

  <div class="card">
    <h2>📌 逐步约束</h2>
    <div class="inline-fields">
      <div class="field">
        <label for="conType">约束类型</label>
        <select id="conType">
          <option value="total">红色物品总数 = N</option>
          <option value="exist">存在 X 格物品</option>
          <option value="count1">1 格物品个数 = N</option>
        </select>
      </div>
      <div class="field" style="min-width:110px">
        <label for="conVal">数值</label>
        <input id="conVal" type="number" min="1" step="1" inputmode="numeric" placeholder="N / X">
      </div>
    </div>
    <button class="btn primary" id="btnAddConstraint" style="width:100%;margin-top:4px">➕ 添加约束</button>
    <div class="constraint-tags" id="constraintTags"></div>
    <div class="btn-row">
      <button class="btn" id="btnUndo">↩️ 撤销上一条约束</button>
      <button class="btn" id="btnClearConstraints">🧹 清空全部约束</button>
      <button class="btn danger" id="btnReset">♻️ 恢复初始状态</button>
    </div>
  </div>

  <div class="card">
    <div class="result-head">
      <div class="count">当前候选：<span class="num" id="candCount">-</span> 种</div>
      <button class="btn primary" id="btnCopyAll">📋 复制全部</button>
    </div>
    <div class="stage-badge" id="stageBadge">阶段一：仅分组统计</div>
    <div class="status" id="rNote"></div>
    <div class="status" id="status">请先填写清单（至少 2 个有效数）和红均数。</div>
    <div id="messageBox"></div>
    <div id="statsBox"></div>
    <div class="cand-list" id="candList"></div>
    <div id="manualBox"></div>
  </div>

  <div class="footer">红均格反推 V2 · 零依赖纯本地计算 · localStorage key redAvgSolver_v2</div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'redAvgSolver_v2';
  var VERSION = 2;
  var DEFAULT_S = [1, 2, 3, 4, 6, 8, 9, 12, 15, 16];
  var CONCISE_S = [1, 2, 3, 4, 6, 8, 12];
  var MAX_PRE = 1000000;
  var MAX_NODES = 500000;
  var MAX_STORE = 200;
  var AUTO_EXPAND = 50;
  var MANUAL_MAX = 199;
  var MAX_UNDO = 100;


  var state = defaultState();
  var undoStack = [];
  var expanded = false;
  var computing = false;
  var computeTimer = null;

  function defaultState() {
    return {
      version: VERSION,
      S: DEFAULT_S.slice(),
      rText: '',
      rRaw: '',
      constraints: [],
      result: null,
      messageKind: '',
      messageText: '',
      noticeText: ''
    };
  }

  function $(id) { return document.getElementById(id); }

  // ---------- 解析 / 校验 ----------
  function parseS(raw) {
    var parts = String(raw || '').split(/[,，、;；\s]+/);
    var arr = [];
    var errors = [];
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i].trim();
      if (!part) continue;
      if (!/^\d+$/.test(part)) {
        errors.push(part);
        continue;
      }
      var n = Number(part);
      if (!Number.isInteger(n) || n <= 0) {
        errors.push(part);
        continue;
      }
      arr.push(n);
    }
    arr.sort(function (a, b) { return a - b; });
    return { ok: arr.length > 0, S: arr, errors: errors };
  }

  function parseR(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (s === '') return { ok: false, rTenth: null, normalized: '' };
    var n = Number(s);
    if (!isFinite(n) || n < 0) return { ok: false, rTenth: null, normalized: '' };
    // 去尾：百分位直接舍去。例如 2.56 -> 25（表示 2.5）
    var rTenth = Math.floor(n * 10 + 1e-9);
    var normalized = (rTenth / 10).toFixed(1);
    return { ok: true, rTenth: rTenth, normalized: normalized };
  }

  // ---------- 枚举引擎（V2 核心：清单多重集合取子集） ----------
  function buildGroups(S) {
    var map = {};
    for (var i = 0; i < S.length; i++) {
      var v = S[i];
      map[v] = (map[v] || 0) + 1;
    }
    var groups = [];
    for (var key in map) {
      if (Object.prototype.hasOwnProperty.call(map, key)) {
        groups.push({ val: Number(key), cnt: map[key] });
      }
    }
    groups.sort(function (a, b) { return a.val - b.val; });
    return groups;
  }

  function preEstimate(groups) {
    var p = 1;
    for (var i = 0; i < groups.length; i++) p *= (groups[i].cnt + 1);
    return p - 1;
  }

  function effectiveConstraints(constraints, groups) {
    var total = null;
    var totalConflict = false;
    var count1 = null;
    var count1Conflict = false;
    var exists = [];
    var existMap = {};
    for (var i = 0; i < constraints.length; i++) {
      var c = constraints[i];
      if (c.type === 'total') {
        if (total === null) total = c.val;
        else if (total !== c.val) totalConflict = true;
      } else if (c.type === 'count1') {
        if (count1 === null) count1 = c.val;
        else if (count1 !== c.val) count1Conflict = true;
      } else if (c.type === 'exist') {
        if (!existMap[c.val]) {
          existMap[c.val] = true;
          exists.push(c.val);
        }
      }
    }
    var groupVals = {};
    for (var j = 0; j < groups.length; j++) groupVals[groups[j].val] = true;
    var missingExist = false;
    for (var k = 0; k < exists.length; k++) {
      if (!groupVals[exists[k]]) missingExist = true;
    }
    return {
      total: total,
      totalConflict: totalConflict,
      count1: count1,
      count1Conflict: count1Conflict,
      exists: exists,
      missingExist: missingExist
    };
  }

  // 精确求“当前部分组合 + 剩余组任意取”可达到的最小/最大平均数。
  // 用于安全剪枝：若所有可能完成方式的平均数都到不了目标区间，则跳过。
  function avgBounds(remStart, sum, n, groups) {
    var s = sum, c = n, a = s / c;
    // 最大：从大到小加，只有高于当前均值才可能提升均值
    for (var i = groups.length - 1; i >= remStart; i--) {
      var v = groups[i].val;
      if (v > a) {
        s += v * groups[i].cnt;
        c += groups[i].cnt;
        a = s / c;
      } else {
        break;
      }
    }
    var max = a;
    // 最小：从小到大加，只有低于当前均值才可能降低均值
    s = sum; c = n; a = s / c;
    for (var j = remStart; j < groups.length; j++) {
      var v2 = groups[j].val;
      if (v2 < a) {
        s += v2 * groups[j].cnt;
        c += groups[j].cnt;
        a = s / c;
      } else {
        break;
      }
    }
    return { min: a, max: max };
  }

  function enumerateCandidates(S, rTenth, constraints) {
    var groups = buildGroups(S);
    var pre = preEstimate(groups);
    if (pre > MAX_PRE) {
      var err = new Error('PRE_LIMIT');
      err.pre = pre;
      err.len = S.length;
      throw err;
    }

    var eff = effectiveConstraints(constraints, groups);
    var hits = [];
    var stats = {};
    var totalCount = 0;
    var nodes = 0;
    var suffixCount = new Array(groups.length + 1);
    suffixCount[groups.length] = 0;
    for (var i = groups.length - 1; i >= 0; i--) {
      suffixCount[i] = suffixCount[i + 1] + groups[i].cnt;
    }

    // 约束本身矛盾，或要求存在的值根本不在清单中，直接 0 候选
    if (eff.totalConflict || eff.count1Conflict || eff.missingExist) {
      return { hits: hits, stats: stats, totalCount: totalCount, truncated: false };
    }

    function passes(combo) {
      if (eff.total !== null && combo.length !== eff.total) return false;
      for (var i = 0; i < eff.exists.length; i++) {
        if (combo.indexOf(eff.exists[i]) === -1) return false;
      }
      if (eff.count1 !== null) {
        var ones = 0;
        for (var j = 0; j < combo.length; j++) if (combo[j] === 1) ones++;
        if (ones !== eff.count1) return false;
      }
      return true;
    }

    function dfs(idx, parts, sum, n) {
      nodes++;
      if (nodes > MAX_NODES) throw new Error('NODE_LIMIT');

      if (idx === groups.length) {
        if (n === 0) return;
        // 整数运算：floor(10*sum/n) === rTenth
        // 等价 10*sum ∈ [n*rTenth, n*rTenth+n)
        if (sum * 10 >= n * rTenth && sum * 10 < n * (rTenth + 1) && passes(parts)) {
          totalCount++;
          stats[n] = (stats[n] || 0) + 1;
          if (hits.length < MAX_STORE) hits.push(parts.slice());
        }
        return;
      }

      var g = groups[idx];
      for (var k = 0; k <= g.cnt; k++) {
        var nextN = n + k;
        var nextSum = sum + g.val * k;

        // 约束剪枝：红色物品总数
        if (eff.total !== null) {
          if (nextN > eff.total) continue;
          if (nextN + suffixCount[idx + 1] < eff.total) continue;
        }
        // 约束剪枝：存在 X 格物品（当前组是 X 的唯一来源，k=0 则不可能满足）
        if (k === 0 && eff.exists.indexOf(g.val) !== -1) continue;
        // 约束剪枝：1 格物品个数
        if (g.val === 1 && eff.count1 !== null && k > eff.count1) continue;

        // 安全均值区间剪枝：剩余任意取都达不到目标区间则跳过
        if (nextN > 0) {
          var b = avgBounds(idx + 1, nextSum, nextN, groups);
          if (b.max * 10 < rTenth) continue;
          if (b.min * 10 >= rTenth + 1) continue;
        }

        for (var i = 0; i < k; i++) parts.push(g.val);
        dfs(idx + 1, parts, nextSum, nextN);
        for (var i = 0; i < k; i++) parts.pop();
      }
    }

    dfs(0, [], 0, 0);
    return {
      hits: hits,
      stats: stats,
      totalCount: totalCount,
      truncated: totalCount > MAX_STORE
    };
  }

  // ---------- 计算 ----------
  function computeCandidates() {
    var sParsed = parseS($('SInput').value);
    var rParsed = parseR($('rInput').value);

    var invalidItems = sParsed.errors.length ? '已忽略非法项：' + sParsed.errors.join('、') + '；' : '';

    if (sParsed.S.length < 2) {
      state.result = null;
      state.messageKind = 'error';
      state.messageText = invalidItems + '清单至少需要 2 个有效格子数。';
      state.rText = rParsed.ok ? rParsed.normalized : '';
      renderResults();
      return false;
    }
    if (!rParsed.ok) {
      state.result = null;
      state.messageKind = 'error';
      state.messageText = '请填写有效的红均数（非负数字，如 2.5）。';
      renderResults();
      return false;
    }

    // 🔴 修复(2026-09-01)：不回填输入框——回填会把用户正在输入的 "4" 抢成 "4.0"，
    // 导致无法输入十分位。输入框保持用户原文，去尾值仅存 state.rText 供结果区显示。
    state.S = sParsed.S.slice();
    state.rText = rParsed.normalized;
    state.rRaw = $('rInput').value.trim();

    try {
      var result = enumerateCandidates(state.S, rParsed.rTenth, state.constraints);
      state.result = result;
      state.messageKind = 'ok';
      state.messageText = invalidItems ? invalidItems.replace(/；$/, '。') + '计算完成。' : '计算完成。';
      if (result.totalCount === 0) {
        state.messageKind = 'err';
        state.messageText = state.constraints.length > 0
          ? '当前约束下无匹配组合，可能约束矛盾，可撤销或清空约束。'
          : '当前清单与红均数下无匹配组合。';
      } else if (result.totalCount > MAX_STORE) {
        state.messageKind = 'warn';
        state.messageText = invalidItems + '结果过多（' + result.totalCount + ' 条），仅显示分组统计；建议补充约束。';
      } else if (invalidItems) {
        state.messageKind = 'warn';
        state.messageText = invalidItems.replace(/；$/, '。') + '已按有效项计算。';
      }
    } catch (e) {
      state.result = null;
      state.messageKind = 'error';
      if (e && e.message === 'PRE_LIMIT') {
        state.messageText = '清单 ' + e.len + ' 个元素，组合数约 ' + e.pre.toLocaleString('zh-CN') + '，请收紧到 ≤20 个元素。';
      } else if (e && e.message === 'NODE_LIMIT') {
        state.messageText = '计算节点超过 50 万，请补充约束或收紧清单后重试。';
      } else {
        state.messageText = '计算失败：' + (e && e.message ? e.message : e);
      }
      renderResults();
      return false;
    }

    renderResults();
    return true;
  }

  // ---------- 渲染 ----------
  function constraintText(c) {
    if (c.type === 'total') return '红色物品总数 = ' + c.val;
    if (c.type === 'exist') return '存在 ' + c.val + ' 格物品';
    if (c.type === 'count1') return '1 格物品 = ' + c.val + ' 个';
    return c.type + ' ' + c.val;
  }

  function renderConstraints() {
    var box = $('constraintTags');
    box.innerHTML = '';
    if (!state.constraints.length) {
      var empty = document.createElement('span');
      empty.className = 'status';
      empty.textContent = '暂无约束';
      box.appendChild(empty);
      return;
    }
    for (var i = 0; i < state.constraints.length; i++) {
      (function (idx) {
        var tag = document.createElement('span');
        tag.className = 'tag';
        var txt = document.createElement('span');
        txt.textContent = constraintText(state.constraints[idx]);
        var del = document.createElement('button');
        del.type = 'button';
        del.textContent = '✕';
        del.setAttribute('aria-label', '删除约束');
        del.addEventListener('click', function () {
          if (state.constraints.length === 0) return;
          pushUndo();
          state.constraints.splice(idx, 1);
          expanded = false;
          renderConstraints();
          scheduleCompute(0);
          saveState();
        });
        tag.appendChild(txt);
        tag.appendChild(del);
        box.appendChild(tag);
      })(i);
    }
  }

  function renderMessage(kind, text) {
    var box = $('messageBox');
    box.innerHTML = '';
    if (!text) return;
    var div = document.createElement('div');
    if (kind === 'err') div.className = 'err';
    else if (kind === 'warn') div.className = 'warn';
    else div.className = 'ok';
    div.textContent = text;
    box.appendChild(div);
  }

  function appendMessage(kind, text) {
    if (!text) return;
    var box = $('messageBox');
    var div = document.createElement('div');
    if (kind === 'err') div.className = 'err';
    else if (kind === 'warn') div.className = 'warn';
    else div.className = 'ok';
    div.textContent = text;
    box.appendChild(div);
  }

  function comboLabel(combo) {
    return combo.join('+') + '（' + combo.length + '件）';
  }

  function buildCopyText(comboList) {
    var lines = [];
    lines.push('【红均格反推V2·俱乐大玩家】');
    lines.push('当前候选：' + comboList.length + ' 种');
    for (var i = 0; i < comboList.length; i++) {
      lines.push(comboLabel(comboList[i]));
    }
    return lines.join('\n');
  }

  function renderStats() {
    var box = $('statsBox');
    box.innerHTML = '';
    if (!state.result || state.result.totalCount === 0) return;
    var stats = state.result.stats;
    var keys = [];
    for (var k in stats) {
      if (Object.prototype.hasOwnProperty.call(stats, k)) keys.push(Number(k));
    }
    keys.sort(function (a, b) { return a - b; });
    var wrap = document.createElement('div');
    wrap.className = 'stats';
    for (var i = 0; i < keys.length; i++) {
      var row = document.createElement('div');
      row.className = 'stat-row';
      var left = document.createElement('span');
      left.textContent = keys[i] + ' 个一组';
      var right = document.createElement('span');
      right.textContent = stats[keys[i]] + ' 种';
      row.appendChild(left);
      row.appendChild(right);
      wrap.appendChild(row);
    }
    var totalRow = document.createElement('div');
    totalRow.className = 'stat-row total';
    var tLeft = document.createElement('span');
    tLeft.textContent = '合计';
    var tRight = document.createElement('span');
    tRight.textContent = state.result.totalCount + ' 种';
    totalRow.appendChild(tLeft);
    totalRow.appendChild(tRight);
    wrap.appendChild(totalRow);
    box.appendChild(wrap);
  }

  function renderDetails() {
    var listBox = $('candList');
    listBox.innerHTML = '';
    if (!state.result || state.result.totalCount === 0) return;

    // 阶段一（无约束）：只显示分组统计，不显示明细
    if (state.constraints.length === 0) {
      var tip = document.createElement('div');
      tip.className = 'status';
      tip.textContent = '当前为阶段一：仅显示分组统计。添加约束后自动展开明细。';
      listBox.appendChild(tip);
      return;
    }

    var count = state.result.totalCount;
    if (count > MAX_STORE) return; // >200 只统计+警告，不展开

    var showList = false;
    if (count <= AUTO_EXPAND) {
      showList = true;
    } else if (count <= MANUAL_MAX && expanded) {
      showList = true;
    }

    if (showList) {
      var rows = state.result.hits;
      for (var i = 0; i < rows.length; i++) {
        (function (combo) {
          var row = document.createElement('div');
          row.className = 'cand-row' + (count === 1 ? ' single' : '');
          var comboEl = document.createElement('span');
          comboEl.className = 'combo';
          comboEl.textContent = comboLabel(combo);
          var copyBtn = document.createElement('button');
          copyBtn.className = 'btn copy-btn';
          copyBtn.textContent = '复制单行';
          copyBtn.addEventListener('click', function () {
            copyText(buildCopyText([combo]));
          });
          row.appendChild(comboEl);
          row.appendChild(copyBtn);
          listBox.appendChild(row);
        })(rows[i]);
      }
      if (count === 1) {
        var uniqueTip = document.createElement('div');
        uniqueTip.className = 'status';
        uniqueTip.style.color = '#188038';
        uniqueTip.style.fontWeight = '700';
        uniqueTip.textContent = '✅ 唯一解，就是它！';
        listBox.appendChild(uniqueTip);
      }
    }

    if (count > AUTO_EXPAND && count <= MANUAL_MAX) {
      var toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn collapse-btn';
      toggleBtn.textContent = expanded ? '收起明细' : '展开明细（共' + count + '条）';
      toggleBtn.addEventListener('click', function () {
        expanded = !expanded;
        renderDetails();
      });
      listBox.appendChild(toggleBtn);
    }
  }

  function renderResults() {
    var count = state.result ? state.result.totalCount : 0;
    $('candCount').textContent = (state.rText === '' && !state.result) ? '-' : String(count);

    $('stageBadge').textContent = state.constraints.length > 0
      ? '阶段二：约束收敛'
      : '阶段一：仅分组统计';

    // 去尾提示：输入原文与去尾值不同时告知（如输入 2.56，按 2.5 计算）
    var rNote = '';
    if (state.rText !== '' && state.rRaw !== '' && state.rRaw !== state.rText) {
      rNote = '红均数按 ' + state.rText + ' 计算（输入 ' + state.rRaw + '，百分位已舍去）';
    }
    $('rNote').textContent = rNote;

    renderStats();
    renderDetails();
    renderMessage(state.messageKind, state.messageText);
    appendMessage('warn', state.noticeText);

    var canCopy = state.result && state.result.totalCount > 0 && state.result.totalCount <= MAX_STORE;
    $('btnCopyAll').disabled = !canCopy || computing;
  }

  function renderAll() {
    $('SInput').value = state.S.join(',');
    $('rInput').value = state.rText;
    $('conVal').value = '';
    renderConstraints();
    renderResults();
    $('btnUndo').disabled = undoStack.length === 0 || computing;
    $('btnClearConstraints').disabled = state.constraints.length === 0 || computing;
  }

  // ---------- 计算调度 ----------
  function scheduleCompute(delay) {
    if (computing) return;
    clearTimeout(computeTimer);
    $('status').textContent = '计算中…';
    computeTimer = setTimeout(function () {
      runCompute();
    }, delay == null ? 180 : delay);
  }

  function runCompute() {
    if (computing) return;
    computing = true;
    setBusy(true);
    $('status').textContent = '计算中…';
    setTimeout(function () {
      try {
        computeCandidates();
      } catch (e) {
        state.result = null;
        state.messageKind = 'error';
        state.messageText = '计算异常：' + (e && e.message ? e.message : e);
        renderResults();
      } finally {
        computing = false;
        setBusy(false);
        saveState();
      }
      $('status').textContent = '计算完成。';
    }, 20);
  }

  function setBusy(busy) {
    $('btnAddConstraint').disabled = busy;
    $('btnUndo').disabled = busy || undoStack.length === 0;
    $('btnClearConstraints').disabled = busy || state.constraints.length === 0;
    $('btnReset').disabled = busy;
    $('btnCopyAll').disabled = busy || !state.result || state.result.totalCount === 0 || state.result.totalCount > MAX_STORE;
  }

  // ---------- 约束操作 ----------
  function pushUndo() {
    undoStack.push(state.constraints.map(function (c) { return { type: c.type, val: c.val }; }));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  }

  function addConstraint() {
    if (computing) return;
    var type = $('conType').value;
    var val = Number($('conVal').value);
    if (!Number.isInteger(val) || val <= 0) {
      renderMessage('error', '约束数值必须是正整数。');
      return;
    }
    var sParsed = parseS($('SInput').value);
    if (sParsed.S.length < 2) {
      renderMessage('error', '请先输入至少 2 个有效格子数。');
      return;
    }
    if (type === 'total' && val > sParsed.S.length) {
      renderMessage('error', '红色物品总数不能超过清单元素个数（' + sParsed.S.length + '）。');
      return;
    }
    if (type === 'count1') {
      var oneCount = 0;
      for (var i = 0; i < sParsed.S.length; i++) if (sParsed.S[i] === 1) oneCount++;
      if (val > oneCount) {
        renderMessage('error', '1 格物品个数不能超过清单中 1 的个数（' + oneCount + '）。');
        return;
      }
    }
    if (type === 'exist' && sParsed.S.indexOf(val) === -1) {
      renderMessage('error', '清单中没有 ' + val + ' 格物品。');
      return;
    }
    state.noticeText = '';
    pushUndo();
    state.constraints.push({ type: type, val: val });
    expanded = false;
    $('conVal').value = '';
    renderConstraints();
    scheduleCompute(0);
    saveState();
  }

  function undoConstraint() {
    if (computing || !undoStack.length) return;
    state.noticeText = '';
    state.constraints = undoStack.pop().slice();
    expanded = false;
    renderConstraints();
    scheduleCompute(0);
    saveState();
  }

  function clearConstraints() {
    if (computing || !state.constraints.length) return;
    state.noticeText = '';
    pushUndo();
    state.constraints = [];
    expanded = false;
    renderConstraints();
    scheduleCompute(0);
    saveState();
    renderMessage('ok', '已清空全部约束，回到仅红均数的大池统计。');
  }

  function resetAll() {
    if (computing) return;
    if (!confirm('确定恢复初始状态吗？清单、红均数、约束将全部清空。')) return;
    state = defaultState();
    undoStack = [];
    expanded = false;
    $('SInput').value = state.S.join(',');
    $('rInput').value = '';
    $('conVal').value = '';
    renderAll();
    saveState();
    $('status').textContent = '已恢复初始状态。';
  }

  // ---------- localStorage ----------
  function validState(obj) {
    if (!obj || typeof obj !== 'object') return false;
    if (obj.version !== VERSION) return false;
    if (!Array.isArray(obj.S) || !obj.S.length) return false;
    for (var i = 0; i < obj.S.length; i++) {
      if (!Number.isInteger(obj.S[i]) || obj.S[i] <= 0) return false;
    }
    if (typeof obj.rText !== 'string') return false;
    if (!Array.isArray(obj.constraints)) return false;
    for (var j = 0; j < obj.constraints.length; j++) {
      var c = obj.constraints[j];
      if (!c || ['total', 'exist', 'count1'].indexOf(c.type) === -1) return false;
      if (!Number.isInteger(c.val) || c.val <= 0) return false;
    }
    return true;
  }

  function saveState() {
    try {
      var data = {
        version: VERSION,
        S: state.S,
        rText: state.rText,
        constraints: state.constraints.map(function (c) { return { type: c.type, val: c.val }; })
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      // localStorage 不可用时静默降级
    }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var obj = JSON.parse(raw);
      if (!validState(obj)) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }
      state.S = obj.S.slice();
      state.rText = obj.rText || '';
      state.constraints = obj.constraints.map(function (c) { return { type: c.type, val: c.val }; });
      undoStack = [];
      expanded = false;
    } catch (e) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e2) {}
    }
  }

  // ---------- 复制 ----------
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.className = 'manual-copy';
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (!ok) {
        var box = $('manualBox');
        box.innerHTML = '';
        var tip = document.createElement('div');
        tip.className = 'status';
        tip.textContent = '自动复制未成功，请长按下方文本手动复制：';
        var area = document.createElement('textarea');
        area.className = 'manual-copy';
        area.value = text;
        area.setAttribute('readonly', '');
        box.appendChild(tip);
        box.appendChild(area);
        return false;
      }
      $('status').textContent = '已复制到剪贴板。';
      return true;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        $('status').textContent = '已复制到剪贴板。';
      }).catch(function () {
        fallback();
      });
    } else {
      fallback();
    }
  }

  // ---------- 事件 ----------
  function clearConstraintsOnInputChanged(reason) {
    if (state.constraints.length > 0) {
      state.constraints = [];
      undoStack = [];
      expanded = false;
      renderConstraints();
      state.noticeText = reason + '，旧约束已自动清空。';
      state.messageKind = 'warn';
      state.messageText = '';
      renderMessage('warn', state.noticeText);
    }
  }

  $('templateSel').addEventListener('change', function () {
    var val = this.value;
    $('SInput').value = (val === 'concise' ? CONCISE_S : DEFAULT_S).join(',');
    clearConstraintsOnInputChanged('模板/清单已变更');
    scheduleCompute(0);
    saveState();
  });

  $('SInput').addEventListener('input', function () {
    clearConstraintsOnInputChanged('清单已变更');
    scheduleCompute();
    saveState();
  });

  $('rInput').addEventListener('input', function () {
    clearConstraintsOnInputChanged('红均数已变更');
    scheduleCompute();
    saveState();
  });

  $('btnAddConstraint').addEventListener('click', addConstraint);
  $('btnUndo').addEventListener('click', undoConstraint);
  $('btnClearConstraints').addEventListener('click', clearConstraints);
  $('btnReset').addEventListener('click', resetAll);

  $('btnCopyAll').addEventListener('click', function () {
    if (!state.result || state.result.totalCount === 0 || state.result.totalCount > MAX_STORE) {
      renderMessage('error', '当前没有可复制的候选明细（结果过多时仅可复制统计）。');
      return;
    }
    copyText(buildCopyText(state.result.hits));
  });

  // ---------- 初始化 ----------
  loadState();
  renderAll();
  if (state.rText !== '') {
    scheduleCompute(0);
  }
})();
</script>
</body>
</html>
